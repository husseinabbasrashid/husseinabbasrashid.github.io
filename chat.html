<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="نقاش عام - غرفة محادثة عامة على موقع حسين عباس" />
    <meta property="og:title" content="نقاش عام | Hussein Abbas" />
    <title>نقاش عام — Hussein Abbas</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* ═══════════════════════════════════════════
       ROOT VARIABLES
    ═══════════════════════════════════════════ */
        :root {
            --bg-dark: #030712;
            --bg-card: #0f172a;
            --bg-card-hover: #1e293b;
            --card-border: rgba(59, 130, 246, 0.1);
            --card-border-hover: rgba(59, 130, 246, 0.25);
            --text-main: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #3b82f6;
            --accent-secondary: #06b6d4;
            --accent-tertiary: #8b5cf6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --gradient-warm: linear-gradient(135deg, #3b82f6 0%, #06b6d4 50%, #8b5cf6 100%);
            --gradient-gold: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            --gradient-btn: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            --header-bg: rgba(3, 7, 18, 0.88);
            --composer-bg: rgba(3, 7, 18, 0.95);
            --font-family: 'IBM Plex Sans Arabic', sans-serif;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            --radius: 16px;
            --mine-color: #3b82f6;
            --other-color: #1e293b;
        }

        body.light {
            --bg-dark: #f0f4ff;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --card-border: rgba(59, 130, 246, 0.12);
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --header-bg: rgba(240, 244, 255, 0.92);
            --composer-bg: rgba(240, 244, 255, 0.98);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --other-color: #f1f5f9;
        }

        /* ═══════════════════════════════════════════
       RESET
    ═══════════════════════════════════════════ */
        * {
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: background .3s, color .3s;
        }

        /* ═══════════════════════════════════════════
       BACKGROUND
    ═══════════════════════════════════════════ */
        .grid-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image:
                linear-gradient(rgba(59, 130, 246, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: grid-drift 80s linear infinite;
        }

        @keyframes grid-drift {
            0% {
                background-position: 0 0
            }

            100% {
                background-position: 60px 60px
            }
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            filter: blur(80px);
            opacity: .08;
        }

        .glow-orb-1 {
            width: 500px;
            height: 500px;
            background: #3b82f6;
            top: -150px;
            right: -150px;
            animation: orb1 12s ease-in-out infinite alternate;
        }

        .glow-orb-2 {
            width: 400px;
            height: 400px;
            background: #8b5cf6;
            bottom: -100px;
            left: -100px;
            animation: orb2 15s ease-in-out infinite alternate;
        }

        @keyframes orb1 {
            from {
                transform: scale(1) translate(0, 0)
            }

            to {
                transform: scale(1.1) translate(30px, 30px)
            }
        }

        @keyframes orb2 {
            from {
                transform: scale(1) translate(0, 0)
            }

            to {
                transform: scale(1.15) translate(-20px, 20px)
            }
        }

        /* ═══════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════ */
        header {
            flex: 0 0 auto;
            height: 68px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: var(--header-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-bottom: 1px solid var(--card-border);
            z-index: 200;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .25);
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            opacity: .3;
        }

        .header-inner {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-start {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-end {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ─── Icon Buttons ─── */
        .icon-btn {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            border-radius: 14px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1.15rem;
            transition: all .3s cubic-bezier(.4, 0, .2, 1);
            text-decoration: none;
            position: relative;
            font-family: inherit;
        }

        .icon-btn i {
            transition: all .3s cubic-bezier(.4, 0, .2, 1);
        }

        .icon-btn:hover {
            color: var(--accent-primary);
            transform: translateY(-3px) scale(1.1);
        }

        .icon-btn:hover i {
            filter: drop-shadow(0 4px 12px rgba(59, 130, 246, .5));
        }

        .icon-btn:active {
            transform: translateY(-1px) scale(1.05);
        }

        .icon-btn[data-active="true"] {
            color: var(--accent-primary);
            background: rgba(59, 130, 246, .12);
            border-radius: 10px;
        }

        /* Tooltip */
        .icon-btn::after {
            content: attr(data-tip);
            position: absolute;
            bottom: -38px;
            left: 50%;
            transform: translateX(-50%) scale(.9);
            background: var(--bg-card);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: .72rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all .25s;
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .3);
            z-index: 1000;
            font-weight: 600;
        }

        .icon-btn:hover::after {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            bottom: -42px;
        }

        /* back button hover red */
        .back-btn:hover {
            color: #ef4444 !important;
        }

        .back-btn:hover i {
            filter: drop-shadow(0 4px 12px rgba(239, 68, 68, .5)) !important;
        }

        /* Brand */
        .brand-info h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -.4px;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #10b981;
            font-size: .72rem;
            font-weight: 700;
            padding: 3px 9px;
            background: rgba(16, 185, 129, .1);
            border-radius: 12px;
            border: 1px solid rgba(16, 185, 129, .2);
            margin-top: 3px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: currentColor;
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: 0 0 8px currentColor;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1)
            }

            50% {
                opacity: .5;
                transform: scale(.85)
            }
        }

        /* Online counter badge */
        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: .72rem;
            font-weight: 700;
            color: var(--accent-secondary);
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(6, 182, 212, .08);
            border: 1px solid rgba(6, 182, 212, .2);
        }

        /* Msg counter */
        .msg-counter {
            background: rgba(59, 130, 246, .08);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: .78rem;
            color: var(--accent-primary);
            border: 1px solid rgba(59, 130, 246, .25);
            font-weight: 700;
            white-space: nowrap;
        }

        /* ═══════════════════════════════════════════
       SEARCH BAR (collapsible)
    ═══════════════════════════════════════════ */
        .search-bar-wrap {
            max-height: 0;
            overflow: hidden;
            transition: max-height .35s cubic-bezier(.4, 0, .2, 1);
            background: var(--header-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid transparent;
        }

        .search-bar-wrap.open {
            max-height: 60px;
            border-bottom-color: var(--card-border);
        }

        .search-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            background: var(--bg-card-hover);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-family: inherit;
            font-size: .9rem;
            padding: 9px 16px;
            border-radius: 22px;
            transition: all .3s;
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .1);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-count {
            font-size: .8rem;
            color: var(--text-muted);
            white-space: nowrap;
            font-weight: 600;
        }

        /* ═══════════════════════════════════════════
       PINNED MESSAGE BANNER
    ═══════════════════════════════════════════ */
        .pinned-banner {
            max-height: 0;
            overflow: hidden;
            transition: max-height .35s ease;
            background: linear-gradient(135deg, rgba(59, 130, 246, .06), rgba(6, 182, 212, .04));
            border-bottom: 1px solid transparent;
            cursor: pointer;
        }

        .pinned-banner.visible {
            max-height: 60px;
            border-bottom-color: rgba(59, 130, 246, .15);
        }

        .pinned-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .85rem;
            color: var(--text-secondary);
        }

        .pinned-inner i {
            color: var(--accent-primary);
            font-size: .85rem;
        }

        .pinned-text {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .pinned-text strong {
            color: var(--accent-primary);
            margin-left: 4px;
        }

        /* ═══════════════════════════════════════════
       MESSAGES AREA
    ═══════════════════════════════════════════ */
        .main-wrap {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #messagesArea {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 20px 28px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scroll-behavior: smooth;
        }

        #messagesArea::-webkit-scrollbar {
            width: 5px;
        }

        #messagesArea::-webkit-scrollbar-track {
            background: transparent;
        }

        #messagesArea::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 4px;
        }

        /* ─── Date Divider ─── */
        .date-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 14px 0 10px;
            font-size: .72rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .date-divider::before,
        .date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--card-border), transparent);
        }

        /* ─── Message Row ─── */
        .msg {
            display: flex;
            flex-direction: column;
            max-width: 78%;
            margin: 2px 0;
            animation: msg-pop .3s cubic-bezier(.34, 1.56, .64, 1);
            position: relative;
        }

        @keyframes msg-pop {
            from {
                opacity: 0;
                transform: scale(.92) translateY(8px)
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0)
            }
        }

        /* RTL mine = right, other = left */
        html[lang="ar"] #messagesArea {
            direction: rtl;
        }

        html[lang="ar"] .msg.mine {
            align-self: flex-end;
            align-items: flex-end;
        }

        html[lang="ar"] .msg.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        html[lang="en"] #messagesArea {
            direction: ltr;
        }

        html[lang="en"] .msg.mine {
            align-self: flex-end;
            align-items: flex-end;
        }

        html[lang="en"] .msg.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        /* consecutive messages - collapse gap */
        .msg.consecutive {
            margin-top: 1px;
        }

        .msg.consecutive .sender-name {
            display: none;
        }

        /* ─── Avatar ─── */
        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .msg.mine .msg-row {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: .75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-bottom: 2px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
            transition: transform .2s;
        }

        .avatar:hover {
            transform: scale(1.15);
        }

        .msg.consecutive .avatar {
            visibility: hidden;
        }

        /* ─── Sender name ─── */
        .sender-name {
            font-size: .72rem;
            color: var(--accent-primary);
            margin-bottom: 4px;
            padding: 0 4px;
            font-weight: 700;
        }

        /* ─── Bubble ─── */
        .bubble {
            padding: 12px 18px;
            border-radius: 20px;
            font-size: .95rem;
            line-height: 1.65;
            word-wrap: break-word;
            word-break: break-word;
            cursor: pointer;
            user-select: none;
            position: relative;
            overflow: hidden;
            transition: all .25s cubic-bezier(.4, 0, .2, 1);
            max-width: 100%;
        }

        .bubble:active {
            transform: scale(.98);
        }

        /* Mine bubble */
        .msg.mine .bubble {
            background: linear-gradient(135deg, rgba(59, 130, 246, .18), rgba(59, 130, 246, .28));
            color: var(--text-main);
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .3) inset, 0 6px 24px rgba(59, 130, 246, .18);
        }

        html[lang="ar"] .msg.mine .bubble {
            border-bottom-left-radius: 5px;
        }

        html[lang="en"] .msg.mine .bubble {
            border-bottom-right-radius: 5px;
        }

        .msg.mine .bubble::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .08), transparent);
            transform: translateX(-100%);
            transition: transform .6s;
        }

        .msg.mine .bubble:hover::before {
            transform: translateX(100%);
        }

        .msg.mine .bubble:hover {
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .45) inset, 0 8px 32px rgba(59, 130, 246, .25);
            transform: translateY(-1px);
        }

        /* Other bubble */
        .msg.other .bubble {
            background: linear-gradient(135deg, rgba(15, 23, 42, .45), rgba(30, 41, 59, .7));
            color: var(--text-main);
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .12) inset, 0 4px 20px rgba(0, 0, 0, .25);
        }

        html[lang="ar"] .msg.other .bubble {
            border-bottom-right-radius: 5px;
        }

        html[lang="en"] .msg.other .bubble {
            border-bottom-left-radius: 5px;
        }

        .msg.other .bubble:hover {
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .2) inset, 0 6px 24px rgba(0, 0, 0, .3);
            transform: translateY(-1px);
        }

        body.light .msg.mine .bubble {
            background: linear-gradient(135deg, rgba(59, 130, 246, .12), rgba(59, 130, 246, .2));
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .2) inset, 0 4px 16px rgba(59, 130, 246, .1);
        }

        body.light .msg.other .bubble {
            background: linear-gradient(135deg, #fff, #f8fafc);
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .08) inset, 0 4px 16px rgba(0, 0, 0, .07);
            color: #0f172a;
        }

        /* ─── Highlight ─── */
        .msg.highlight-msg .bubble {
            animation: highlight-flash .6s ease-out;
        }

        @keyframes highlight-flash {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
            }

            40% {
                box-shadow: 0 0 0 8px rgba(59, 130, 246, .25);
            }
        }

        /* ─── Media in bubble ─── */
        .msg-img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            margin: 6px 0;
            cursor: pointer;
            transition: transform .2s, opacity .2s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .3);
        }

        .msg-img:hover {
            transform: scale(1.02);
            opacity: .95;
        }

        /* Image lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .9);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            backdrop-filter: blur(8px);
            animation: fade-in .2s;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 88vh;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
        }

        @keyframes fade-in {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        /* ─── Time & Status ─── */
        .msg-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
            margin-top: 6px;
        }

        .msg.other .msg-footer {
            justify-content: flex-start;
        }

        .msg-time {
            font-size: .62rem;
            opacity: .65;
            color: var(--text-muted);
        }

        .msg.mine .msg-time {
            color: rgba(148, 163, 184, .8);
        }

        .msg-status {
            font-size: .62rem;
            color: var(--accent-secondary);
        }

        /* ─── Reply Context ─── */
        .reply-context {
            font-size: .78rem;
            margin-bottom: 8px;
            padding: 8px 12px;
            background: rgba(59, 130, 246, .1);
            border-inline-start: 3px solid var(--accent-primary);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background .2s;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .reply-context:hover {
            background: rgba(59, 130, 246, .18);
        }

        .msg.mine .reply-context {
            background: rgba(255, 255, 255, .08);
        }

        .msg.mine .reply-context:hover {
            background: rgba(255, 255, 255, .13);
        }

        /* ─── Reactions ─── */
        .reactions-bar {
            position: absolute;
            bottom: -14px;
            display: flex;
            gap: 3px;
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            padding: 3px 8px;
            border-radius: 16px;
            font-size: .82rem;
            z-index: 5;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
            cursor: pointer;
            transition: transform .2s;
        }

        .reactions-bar:hover {
            transform: scale(1.08);
        }

        html[lang="ar"] .msg.mine .reactions-bar {
            left: 8px;
        }

        html[lang="ar"] .msg.other .reactions-bar {
            right: 8px;
        }

        html[lang="en"] .msg.mine .reactions-bar {
            right: 8px;
        }

        html[lang="en"] .msg.other .reactions-bar {
            left: 8px;
        }

        /* ─── Translation ─── */
        .translation-wrap {
            border-top: 1px solid rgba(59, 130, 246, .15);
            margin-top: 8px;
            padding-top: 8px;
        }

        .translation-label {
            font-size: .62rem;
            color: var(--accent-primary);
            font-style: italic;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .msg-translation {
            font-size: .85rem;
            opacity: .85;
        }

        .msg.other .msg-translation {
            color: var(--text-secondary);
        }

        /* ─── Typing Indicator ─── */
        .typing-wrap {
            padding: 0 20px 8px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            min-height: 24px;
            display: flex;
            align-items: center;
            transition: opacity .3s;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: .78rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-secondary);
            animation: typing-bounce .9s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes typing-bounce {

            0%,
            80%,
            100% {
                transform: scale(.7);
                opacity: .4
            }

            40% {
                transform: scale(1.1);
                opacity: 1
            }
        }

        /* ═══════════════════════════════════════════
       COMPOSER
    ═══════════════════════════════════════════ */
        .composer-wrap {
            flex: 0 0 auto;
            background: linear-gradient(180deg, transparent, var(--composer-bg));
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(59, 130, 246, .08);
            z-index: 150;
            position: relative;
        }

        .composer-wrap::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, .3), transparent);
        }

        .composer-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 12px 16px 16px;
        }

        /* Reply preview bar */
        .reply-preview-bar {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            margin-bottom: 8px;
            background: var(--bg-card);
            border-radius: 12px;
            border-inline-start: 3px solid var(--accent-primary);
            font-size: .82rem;
            color: var(--text-secondary);
            animation: slide-down .2s ease-out;
        }

        .reply-preview-bar.visible {
            display: flex;
        }

        @keyframes slide-down {
            from {
                opacity: 0;
                transform: translateY(-8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .reply-preview-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .reply-preview-info strong {
            color: var(--accent-primary);
            font-size: .75rem;
        }

        .reply-cancel {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(239, 68, 68, .1);
            border: none;
            color: #ef4444;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .8rem;
            transition: all .2s;
        }

        .reply-cancel:hover {
            background: rgba(239, 68, 68, .2);
            transform: scale(1.1);
        }

        /* Image preview */
        .img-preview-bar {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            margin-bottom: 8px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid rgba(139, 92, 246, .25);
        }

        .img-preview-bar.visible {
            display: flex;
        }

        .img-thumb {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
        }

        .img-preview-name {
            flex: 1;
            font-size: .8rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .img-remove {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(239, 68, 68, .1);
            border: none;
            color: #ef4444;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .78rem;
            transition: all .2s;
        }

        .img-remove:hover {
            background: rgba(239, 68, 68, .2);
            transform: scale(1.1);
        }

        /* Input bar */
        .input-bar {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: linear-gradient(135deg, rgba(15, 23, 42, .4), rgba(15, 23, 42, .6));
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 10px 14px;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .18) inset, 0 10px 36px rgba(0, 0, 0, .3);
            transition: all .35s cubic-bezier(.4, 0, .2, 1);
            position: relative;
            overflow: hidden;
        }

        .input-bar::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(59, 130, 246, .4), rgba(139, 92, 246, .4), rgba(6, 182, 212, .4));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity .4s;
            pointer-events: none;
        }

        .input-bar:focus-within {
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .35) inset, 0 0 36px rgba(59, 130, 246, .2), 0 10px 36px rgba(0, 0, 0, .4);
            transform: translateY(-2px);
        }

        .input-bar:focus-within::before {
            opacity: 1;
        }

        body.light .input-bar {
            background: linear-gradient(135deg, rgba(255, 255, 255, .8), rgba(255, 255, 255, .95));
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .12) inset, 0 8px 28px rgba(0, 0, 0, .08);
        }

        /* Name input */
        #userName {
            background: linear-gradient(135deg, rgba(59, 130, 246, .12), rgba(59, 130, 246, .2));
            border: none;
            color: var(--accent-primary);
            font-size: .85rem;
            font-weight: 700;
            padding: 10px 12px;
            border-radius: 16px;
            width: 80px;
            text-align: center;
            font-family: inherit;
            transition: all .3s;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .25) inset;
            cursor: pointer;
            flex-shrink: 0;
        }

        #userName:focus {
            background: rgba(59, 130, 246, .25);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, .4) inset, 0 0 16px rgba(59, 130, 246, .2);
            transform: scale(1.04);
        }

        /* Emoji button */
        .emoji-trigger {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all .25s;
            flex-shrink: 0;
        }

        .emoji-trigger:hover {
            transform: scale(1.2) rotate(-10deg);
        }

        /* Message textarea */
        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: .96rem;
            font-family: inherit;
            resize: none;
            max-height: 110px;
            min-height: 26px;
            padding: 10px 0;
            line-height: 1.55;
        }

        #messageInput::placeholder {
            color: var(--text-muted);
            opacity: .6;
        }

        #messageInput:focus::placeholder {
            opacity: .35;
        }

        html[lang="ar"] #messageInput {
            text-align: right;
        }

        html[lang="en"] #messageInput {
            text-align: left;
        }

        /* Char counter */
        .char-count {
            font-size: .65rem;
            color: var(--text-muted);
            align-self: flex-end;
            padding-bottom: 12px;
            transition: color .2s;
            flex-shrink: 0;
        }

        .char-count.warn {
            color: var(--accent-secondary);
        }

        .char-count.limit {
            color: #ef4444;
            font-weight: 700;
        }

        /* Attach button */
        .attach-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(139, 92, 246, .12);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all .3s;
            box-shadow: 0 0 0 1px rgba(139, 92, 246, .25) inset;
            flex-shrink: 0;
        }

        .attach-btn:hover {
            color: #8b5cf6;
            background: rgba(139, 92, 246, .22);
            transform: scale(1.1) rotate(12deg);
            box-shadow: 0 0 0 1px rgba(139, 92, 246, .45) inset, 0 6px 20px rgba(139, 92, 246, .35);
        }

        .attach-btn.has-file {
            color: #8b5cf6;
            background: rgba(139, 92, 246, .28);
            animation: pulse-attach 2s infinite;
        }

        @keyframes pulse-attach {

            0%,
            100% {
                box-shadow: 0 0 0 1px rgba(139, 92, 246, .5) inset, 0 0 18px rgba(139, 92, 246, .3);
            }

            50% {
                box-shadow: 0 0 0 1px rgba(139, 92, 246, .7) inset, 0 0 30px rgba(139, 92, 246, .5);
            }
        }

        /* Send button */
        .send-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #2563eb, #1d4ed8);
            color: #fff;
            cursor: pointer;
            display: grid;
            place-items: center;
            font-size: 1rem;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .5) inset, 0 6px 20px rgba(59, 130, 246, .45), 0 0 30px rgba(59, 130, 246, .25);
            transition: all .3s cubic-bezier(.4, 0, .2, 1);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .send-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, .25), transparent);
            opacity: 0;
            transition: opacity .3s;
        }

        .send-btn:hover {
            transform: scale(1.12) rotate(-12deg);
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .7) inset, 0 10px 28px rgba(59, 130, 246, .55), 0 0 50px rgba(59, 130, 246, .4);
        }

        .send-btn:hover::before {
            opacity: 1;
        }

        .send-btn:active {
            transform: scale(1.05) rotate(-12deg);
        }

        .send-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .send-btn i {
            transition: transform .3s;
        }

        .send-btn:hover i {
            transform: translateX(-3px);
        }

        /* ═══════════════════════════════════════════
       EMOJI PICKER POPUP
    ═══════════════════════════════════════════ */
        .emoji-picker-popup {
            position: absolute;
            bottom: 90px;
            left: 20px;
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, .4);
            z-index: 300;
            width: 300px;
            display: none;
            animation: picker-in .25s cubic-bezier(.34, 1.56, .64, 1);
        }

        .emoji-picker-popup.open {
            display: block;
        }

        @keyframes picker-in {
            from {
                opacity: 0;
                transform: scale(.85) translateY(10px)
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0)
            }
        }

        .emoji-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .emoji-tab-btn {
            flex: 1;
            padding: 6px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all .2s;
            color: var(--text-muted);
        }

        .emoji-tab-btn.active,
        .emoji-tab-btn:hover {
            background: rgba(59, 130, 246, .1);
            color: var(--text-main);
            transform: scale(1.1);
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
            max-height: 180px;
            overflow-y: auto;
        }

        .emoji-grid::-webkit-scrollbar {
            width: 3px;
        }

        .emoji-grid::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 2px;
        }

        .emoji-cell {
            font-size: 1.3rem;
            cursor: pointer;
            border-radius: 8px;
            padding: 4px;
            text-align: center;
            transition: all .15s;
            border: none;
            background: transparent;
        }

        .emoji-cell:hover {
            background: rgba(59, 130, 246, .12);
            transform: scale(1.25);
        }

        /* ═══════════════════════════════════════════
       FAB – Scroll to bottom
    ═══════════════════════════════════════════ */
        .fab-scroll {
            position: fixed;
            bottom: 100px;
            left: 24px;
            width: 44px;
            height: 44px;
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 120;
            opacity: 0;
            transform: translateY(16px) scale(.9);
            pointer-events: none;
            transition: all .3s cubic-bezier(.4, 0, .2, 1);
            box-shadow: var(--shadow-lg);
            font-size: .9rem;
        }

        .fab-scroll.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .fab-scroll:hover {
            color: var(--accent-primary);
            border-color: var(--accent-primary);
            transform: translateY(-3px) scale(1.05);
        }

        .fab-new-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ef4444;
            color: #fff;
            font-size: .6rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ═══════════════════════════════════════════
       ACTION MODAL
    ═══════════════════════════════════════════ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            z-index: 400;
            display: none;
            align-items: flex-end;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.open {
            display: flex;
            animation: fade-in .2s;
        }

        .action-menu {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 8px 0 20px;
            box-shadow: 0 -16px 48px rgba(0, 0, 0, .5);
            animation: sheet-up .3s cubic-bezier(.34, 1.56, .64, 1);
        }

        @keyframes sheet-up {
            from {
                transform: translateY(60%)
            }

            to {
                transform: translateY(0)
            }
        }

        .sheet-handle {
            width: 44px;
            height: 4px;
            border-radius: 2px;
            background: var(--card-border);
            margin: 12px auto 14px;
        }

        /* Message preview in modal */
        .modal-msg-preview {
            margin: 0 16px 14px;
            padding: 10px 14px;
            background: var(--bg-card-hover);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            font-size: .82rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-msg-preview i {
            color: var(--accent-primary);
        }

        /* Reaction row */
        .emoji-bar {
            display: flex;
            gap: 4px;
            padding: 4px 16px 14px;
            border-bottom: 1px solid var(--card-border);
            overflow-x: auto;
        }

        .emoji-bar::-webkit-scrollbar {
            display: none;
        }

        .emoji-btn {
            background: rgba(59, 130, 246, .07);
            border: 1px solid transparent;
            border-radius: 12px;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 7px 10px;
            transition: all .2s;
            white-space: nowrap;
        }

        .emoji-btn:hover {
            transform: scale(1.3);
            background: rgba(59, 130, 246, .15);
            border-color: rgba(59, 130, 246, .3);
        }

        .emoji-btn.reacted {
            background: rgba(59, 130, 246, .2);
            border-color: var(--accent-primary);
        }

        /* Menu items */
        .menu-actions {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 13px 16px;
            border-radius: 14px;
            cursor: pointer;
            text-align: start;
            font-family: inherit;
            font-size: .94rem;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: background .2s;
            font-weight: 500;
        }

        .menu-btn:hover {
            background: rgba(59, 130, 246, .08);
        }

        .menu-btn i {
            width: 20px;
            text-align: center;
            color: var(--accent-primary);
            font-size: .95rem;
        }

        .menu-btn.danger {
            color: #ef4444;
        }

        .menu-btn.danger:hover {
            background: rgba(239, 68, 68, .08);
        }

        .menu-btn.danger i {
            color: #ef4444;
        }

        .menu-sep {
            height: 1px;
            background: var(--card-border);
            margin: 4px 16px;
        }

        /* ═══════════════════════════════════════════
       IMAGE LIGHTBOX
    ═══════════════════════════════════════════ */
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
            border: none;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, .2);
            transform: scale(1.1);
        }

        /* ═══════════════════════════════════════════
       TOAST NOTIFICATIONS
    ═══════════════════════════════════════════ */
        .toast-wrap {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            padding: 10px 20px;
            border-radius: 24px;
            font-size: .83rem;
            font-weight: 600;
            color: var(--text-main);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
            animation: toast-in .35s cubic-bezier(.34, 1.56, .64, 1);
            white-space: nowrap;
            max-width: 90vw;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.removing {
            animation: toast-out .3s ease-out forwards;
        }

        @keyframes toast-in {
            from {
                opacity: 0;
                transform: scale(.8) translateY(-8px)
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0)
            }
        }

        @keyframes toast-out {
            from {
                opacity: 1;
                transform: scale(1)
            }

            to {
                opacity: 0;
                transform: scale(.8) translateY(-8px)
            }
        }

        /* ═══════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════ */
        @media(max-width:768px) {
            .msg {
                max-width: 88%;
            }

            header {
                padding: 0 14px;
            }

            .brand-info h1 {
                font-size: 1.05rem;
            }

            .icon-btn {
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }

            .msg-counter {
                padding: 6px 11px;
                font-size: .72rem;
            }

            .composer-inner {
                padding: 10px 12px 14px;
            }

            #userName {
                width: 68px;
                font-size: .8rem;
            }

            .emoji-picker-popup {
                left: 10px;
                right: 10px;
                width: auto;
            }

            .online-badge {
                display: none;
            }
        }

        @media(max-width:400px) {
            .msg {
                max-width: 93%;
            }

            .msg-counter,
            .online-badge {
                display: none;
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }

        /* ═══════════════════════════════════════════
           PARTICLES CANVAS
        ═══════════════════════════════════════════ */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: .45;
        }

        /* ═══════════════════════════════════════════
           THIRD GLOW ORB
        ═══════════════════════════════════════════ */
        .glow-orb-3 {
            width: 350px;
            height: 350px;
            background: #06b6d4;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            animation: orb3 18s ease-in-out infinite alternate;
        }

        @keyframes orb3 {
            from {
                transform: translateX(-60%) scale(1);
            }

            to {
                transform: translateX(-40%) scale(1.12);
            }
        }

        /* ═══════════════════════════════════════════
           SOUND BUTTON
        ═══════════════════════════════════════════ */
        .icon-btn.muted {
            color: #ef4444 !important;
        }

        .icon-btn.muted i {
            filter: drop-shadow(0 4px 12px rgba(239, 68, 68, .5)) !important;
        }

        /* ═══════════════════════════════════════════
           MARKDOWN IN BUBBLES
        ═══════════════════════════════════════════ */
        .bubble-text strong {
            font-weight: 800;
        }

        .bubble-text em {
            font-style: italic;
            opacity: .9;
        }

        .bubble-text code {
            font-family: 'Courier New', monospace;
            background: rgba(59, 130, 246, .18);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: .85em;
        }

        /* ═══════════════════════════════════════════
           COLOR-CODED TOASTS
        ═══════════════════════════════════════════ */
        .toast.success {
            border-color: rgba(16, 185, 129, .4);
            background: linear-gradient(135deg, rgba(16, 185, 129, .12), var(--bg-card));
        }

        .toast.error {
            border-color: rgba(239, 68, 68, .4);
            background: linear-gradient(135deg, rgba(239, 68, 68, .12), var(--bg-card));
        }

        .toast.info {
            border-color: rgba(59, 130, 246, .4);
            background: linear-gradient(135deg, rgba(59, 130, 246, .12), var(--bg-card));
        }

        .toast.warn {
            border-color: rgba(245, 158, 11, .4);
            background: linear-gradient(135deg, rgba(245, 158, 11, .12), var(--bg-card));
        }

        /* ═══════════════════════════════════════════
           EMPTY STATE
        ═══════════════════════════════════════════ */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 40px 20px;
            text-align: center;
            animation: fade-in .6s ease;
        }

        .empty-icon {
            font-size: 4rem;
            animation: float-icon 3s ease-in-out infinite;
            filter: drop-shadow(0 8px 24px rgba(59, 130, 246, .4));
        }

        @keyframes float-icon {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .empty-title {
            font-size: 1.3rem;
            font-weight: 800;
            background: var(--gradient-warm);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .empty-sub {
            font-size: .9rem;
            color: var(--text-muted);
            max-width: 260px;
            line-height: 1.7;
        }

        .empty-arrow {
            font-size: 2rem;
            color: var(--accent-primary);
            opacity: .6;
            animation: bounce-down 1.5s ease-in-out infinite;
        }

        @keyframes bounce-down {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(8px);
            }
        }

        /* ═══════════════════════════════════════════
           SKELETON LOADING
        ═══════════════════════════════════════════ */
        .skeleton-wrap {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            width: 100%;
        }

        .skeleton-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .skeleton-row.right {
            flex-direction: row-reverse;
        }

        .skeleton-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--bg-card-hover);
            flex-shrink: 0;
            animation: shimmer 1.6s infinite;
        }

        .skeleton-bubble {
            height: 48px;
            border-radius: 18px;
            background: var(--bg-card-hover);
            animation: shimmer 1.6s infinite;
        }

        @keyframes shimmer {
            0% {
                opacity: .4;
            }

            50% {
                opacity: .8;
            }

            100% {
                opacity: .4;
            }
        }

        /* ═══════════════════════════════════════════
           EMOJI PICKER SEARCH
        ═══════════════════════════════════════════ */
        .emoji-search {
            width: 100%;
            background: var(--bg-card-hover);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-family: inherit;
            font-size: .85rem;
            padding: 7px 12px;
            border-radius: 14px;
            margin-bottom: 10px;
            transition: all .3s;
        }

        .emoji-search:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .12);
        }

        .emoji-search::placeholder {
            color: var(--text-muted);
        }

        /* ═══════════════════════════════════════════
           REACTION POP ANIMATION
        ═══════════════════════════════════════════ */
        .reactions-bar span {
            display: inline-block;
            animation: react-pop .35s cubic-bezier(.34, 1.56, .64, 1);
        }

        @keyframes react-pop {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ═══════════════════════════════════════════
           SWIPE REPLY INDICATOR
        ═══════════════════════════════════════════ */
        .swipe-reply-hint {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-primary);
            font-size: .9rem;
            opacity: 0;
            transition: opacity .2s;
            pointer-events: none;
        }

        html[lang="ar"] .msg.mine .swipe-reply-hint {
            left: -28px;
        }

        html[lang="ar"] .msg.other .swipe-reply-hint {
            right: -28px;
        }

        html[lang="en"] .msg.mine .swipe-reply-hint {
            right: -28px;
        }

        html[lang="en"] .msg.other .swipe-reply-hint {
            left: -28px;
        }

        .msg.swiping .swipe-reply-hint {
            opacity: 1;
        }

        /* ═══════════════════════════════════════════
           ENHANCED SCROLL FAB
        ═══════════════════════════════════════════ */
        .fab-scroll {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-card-hover)) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .35), 0 0 0 1px var(--card-border) !important;
        }

        .fab-scroll:hover {
            background: linear-gradient(135deg, rgba(59, 130, 246, .15), rgba(59, 130, 246, .08)) !important;
            box-shadow: 0 12px 40px rgba(59, 130, 246, .25), 0 0 0 1px rgba(59, 130, 246, .35) !important;
        }
    </style>
</head>

<body>

    <!-- Background -->
    <canvas id="particleCanvas"></canvas>
    <div class="grid-bg"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <!-- ═══ HEADER ═══ -->
    <header>

    <!-- Search Bar -->

    <!-- Pinned Message Banner -->

    <!-- ═══ MESSAGES ═══ -->
    <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
        <div class="main-wrap">
            <div id="messagesArea">
                <!-- skeleton shown while Firebase loads -->
                <div class="skeleton-wrap" id="skeletonLoader">
                    <div class="skeleton-row">
                        <div class="skeleton-avatar"></div>

    <!-- ═══ COMPOSER ═══ -->
    <div class="composer-wrap">
        <div class="composer-inner">

            <!-- Reply preview -->
            <div class="reply-preview-bar" id="replyPreview">
                <i class="fas fa-reply" style="color:var(--accent-primary);font-size:.85rem;flex-shrink:0;"></i>

                        style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem;"></span>

    <!-- Scroll to bottom FAB -->

    <!-- ═══ EMOJI PICKER ═══ -->
    <div class="emoji-picker-popup" id="emojiPicker">
        <input class="emoji-search" id="emojiSearch" placeholder="🔍 ابحث عن إيموجي..." autocomplete="off">
        <div class="emoji-tabs" id="emojiTabs"></div>

    <!-- ═══ ACTION MODAL ═══ -->
    <div id="actionModal" class="modal-overlay">
        <div class="action-menu">

            </div>
            <div class="emoji-bar" id="emojiBar">
                <button class="emoji-btn" onclick="addReaction('❤️')">❤️</button>
                <button class="emoji-btn" onclick="addReaction('😂')">😂</button>
                <button class="emoji-btn" onclick="addReaction('🔥')">🔥</button>
                <button class="emoji-btn" onclick="addReaction('😮')">😮</button>
                <button class="emoji-btn" onclick="addReaction('😭')">😭</button>
                <button class="emoji-btn" onclick="addReaction('👏')">👏</button>
                <button class="emoji-btn" onclick="addReaction('💯')">💯</button>

    <!-- ═══ IMAGE LIGHTBOX ═══ -->
