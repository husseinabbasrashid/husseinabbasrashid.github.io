    <!-- ═══ TOAST ═══ -->
    <div class="toast-wrap" id="toastWrap"></div>

    <!-- ═════════════════════════════════════════════════════
     JAVASCRIPT
════════════════════════════════════════════════════════ -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
        import {
            getFirestore, collection, addDoc, serverTimestamp, query,
            orderBy, onSnapshot, limit, doc, updateDoc, deleteDoc, getDoc
        }
            from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';
        import { getAuth, signInAnonymously, onAuthStateChanged }
            from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL }
            from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js';

        /* ──────────────────────────────
           FIREBASE CONFIG
        ────────────────────────────── */
        const firebaseConfig = {
            apiKey: "AIzaSyBgATDvc0MRJ-uknqIVUUi1gq6pS1v7coQ",
            authDomain: "my-public-chat-8cc7f.firebaseapp.com",
            projectId: "my-public-chat-8cc7f",
            storageBucket: "my-public-chat-8cc7f.firebasestorage.app",
            messagingSenderId: "707480574674",
            appId: "1:707480574674:web:4b30cb5a691a0a92516b0b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const msgsCol = collection(db, 'public_messages');

        /* ──────────────────────────────
           STATE
        ────────────────────────────── */
        let currentUser = null;
        let selectedMsg = null;
        let replyTarget = null;
        let isScrolledUp = false;
        let translationMode = localStorage.getItem('translation_mode') === 'true';
        let newMsgCount = 0;
        let pinnedMsgId = localStorage.getItem('chat_pinned') || null;
        let searchActive = false;
        let searchResults = [];
        let searchIdx = 0;
        let allMessages = [];
        let typingTimer = null;
        let lastTypingTime = 0;
        const locallyDeletedIds = new Set();

        const LOCAL_ID = (() => {
            let id = localStorage.getItem('chat_client_id');
            if (!id) { id = 'c_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('chat_client_id', id); }
            return id;
        })();

        /* ──────────────────────────────
           AVATAR COLORS  (deterministic per name)
        ────────────────────────────── */
        const AVATAR_COLORS = [
            ['#3b82f6', '#1d4ed8'], ['#8b5cf6', '#6d28d9'], ['#06b6d4', '#0891b2'],
            ['#10b981', '#059669'], ['#f59e0b', '#d97706'], ['#ef4444', '#dc2626'],
            ['#ec4899', '#db2777'], ['#14b8a6', '#0d9488']
        ];
        function getAvatarColor(name) {
            let h = 0; for (let c of name) h = (h * 31 + c.charCodeAt(0)) % AVATAR_COLORS.length;
            return AVATAR_COLORS[h];
        }

        /* ──────────────────────────────
           DOM REFS
        ────────────────────────────── */
        const messagesEl = document.getElementById('messagesArea');
        const chatForm = document.getElementById('chatForm');
        const sendBtn = document.getElementById('sendBtn');
        const userNameInput = document.getElementById('userName');
        const messageInput = document.getElementById('messageInput');
        const msgCountEl = document.getElementById('msgCount');
        const scrollFab = document.getElementById('scrollToBottom');
        const newMsgBadge = document.getElementById('newMsgBadge');
        const imageInput = document.getElementById('imageInput');
        const triggerFile = document.getElementById('triggerFileBtn');
        const imgPreviewBar = document.getElementById('imgPreviewBar');
        const imgThumb = document.getElementById('imgThumb');
        const imgPreviewNm = document.getElementById('imgPreviewName');
        const actionModal = document.getElementById('actionModal');
        const deleteBtn = document.getElementById('deleteBtn');
        const pinBtn = document.getElementById('pinBtn');
        const replyPreview = document.getElementById('replyPreview');
        const emojiPicker = document.getElementById('emojiPicker');
        const pinnedBanner = document.getElementById('pinnedBanner');
        const pinnedText = document.getElementById('pinnedText');
        const charCount = document.getElementById('charCount');
        const typingEl = document.getElementById('typingIndicator');
        const typingText = document.getElementById('typingText');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        /* ──────────────────────────────
           THEME
        ────────────────────────────── */
        const themeBtn = document.getElementById('themeToggle');
        const themeIcon = themeBtn.querySelector('i');
        if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light'); themeIcon.className = 'fas fa-sun'; }
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light');
            const light = document.body.classList.contains('light');
            themeIcon.className = light ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('theme', light ? 'light' : 'dark');
        });

        /* ──────────────────────────────
           SOUND TOGGLE
        ────────────────────────────── */
        let soundEnabled = localStorage.getItem('chat_sound') !== 'false';
        const soundBtn = document.getElementById('soundToggle');
        const soundIcon = soundBtn.querySelector('i');
        function applySoundUI() {
            soundIcon.className = soundEnabled ? 'fas fa-volume-high' : 'fas fa-volume-xmark';
            soundBtn.classList.toggle('muted', !soundEnabled);
            soundBtn.dataset.tip = soundEnabled ? 'كتم الصوت' : 'تشغيل الصوت';
        }
        applySoundUI();
        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            localStorage.setItem('chat_sound', soundEnabled);
            applySoundUI();
            showToast(soundEnabled ? '🔔 تم تفعيل الإشعارات الصوتية' : '🔕 تم كتم الصوت', 2200, 'info');
        });

        // Notification sound (short beep via Web Audio API)
        let audioCtx = null;
        function playReceiveSound() {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
                osc.start(); osc.stop(audioCtx.currentTime + 0.28);
            } catch (e) { }
        }

        /* ──────────────────────────────
           LANGUAGE
        ────────────────────────────── */
        const langToggle = document.getElementById('langToggle');
        const langLabel = document.getElementById('langLabel');
        let lang = localStorage.getItem('chat_lang') || 'ar';
        applyLang(lang);

        langToggle.addEventListener('click', () => {
            lang = lang === 'ar' ? 'en' : 'ar';
            applyLang(lang);
            localStorage.setItem('chat_lang', lang);
        });
        function applyLang(l) {
            document.documentElement.lang = l;
            document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
            langLabel.textContent = l === 'ar' ? 'ع' : 'EN';
            document.getElementById('roomTitle').textContent = l === 'ar' ? 'نقاش عام' : 'Public Chat';
            document.getElementById('statusText').textContent = l === 'ar' ? 'متصل' : 'Online';
            messageInput.placeholder = l === 'ar' ? 'اكتب رسالتك...' : 'Type a message...';
            userNameInput.placeholder = l === 'ar' ? 'اسمك' : 'Name';
        }

        /* ──────────────────────────────
           TRANSLATION
        ────────────────────────────── */
        const translateBtn = document.getElementById('translateBtn');
        setTranslateUI();
        translateBtn.addEventListener('click', () => {
            translationMode = !translationMode;
            localStorage.setItem('translation_mode', translationMode);
            setTranslateUI();
            showToast(translationMode ? '🌐 الترجمة التلقائية مفعّلة' : '🌐 الترجمة معطّلة');
            renderMessages(allMessages); // re-render
        });
        function setTranslateUI() {
            translateBtn.dataset.active = translationMode;
        }

        async function translateText(text, targetLang) {
            try {
                const src = targetLang === 'en' ? 'ar' : 'en';
                const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${src}|${targetLang}`);
                const d = await r.json();
                return d.responseStatus === 200 ? d.responseData.translatedText : text;
            } catch { return text; }
        }

        /* ──────────────────────────────
           SEARCH
        ────────────────────────────── */
        const searchBarWrap = document.getElementById('searchBarWrap');
        const searchInput = document.getElementById('searchInput');
        const searchCount = document.getElementById('searchCount');

        document.getElementById('searchBtn').addEventListener('click', toggleSearch);
        function toggleSearch() {
            searchActive = !searchActive;
            searchBarWrap.classList.toggle('open', searchActive);
            if (searchActive) { setTimeout(() => searchInput.focus(), 350); }
            else { searchInput.value = ''; searchCount.textContent = ''; clearSearchHighlights(); }
        }
        function closeSearch() { searchActive = false; searchBarWrap.classList.remove('open'); searchInput.value = ''; searchCount.textContent = ''; clearSearchHighlights(); }

        searchInput.addEventListener('input', debounce(doSearch, 300));
        function doSearch() {
            const q = searchInput.value.trim().toLowerCase();
            clearSearchHighlights();
            if (!q) { searchCount.textContent = ''; return; }
            searchResults = [];
            messagesEl.querySelectorAll('.msg').forEach(el => {
                const text = el.querySelector('.bubble-text')?.textContent?.toLowerCase() || '';
                if (text.includes(q)) { searchResults.push(el); el.classList.add('highlight-msg'); }
            });
            searchCount.textContent = searchResults.length ? `${searchResults.length} نتيجة` : 'لا نتائج';
            if (searchResults[0]) searchResults[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        function clearSearchHighlights() { messagesEl.querySelectorAll('.highlight-msg').forEach(e => e.classList.remove('highlight-msg')); }
        function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

        /* ──────────────────────────────
           PINNED MESSAGE
        ────────────────────────────── */
        function updatePinnedBanner() {
            if (!pinnedMsgId) { pinnedBanner.classList.remove('visible'); return; }
            const msg = allMessages.find(m => m.id === pinnedMsgId);
            if (!msg) { pinnedBanner.classList.remove('visible'); return; }
            pinnedText.innerHTML = `<strong>${escHtml(msg.name || 'مستخدم')}:</strong> ${escHtml((msg.text || '').slice(0, 80))}`;
            pinnedBanner.classList.add('visible');
        }
        pinnedBanner.addEventListener('click', () => {
            if (pinnedMsgId) scrollToMessage(pinnedMsgId);
        });

        /* ──────────────────────────────
           EMOJI PICKER
        ────────────────────────────── */
        const EMOJI_CATS = {
            '😊': ['😊', '😂', '🥲', '😅', '😆', '😍', '🥰', '😘', '😋', '😜', '🤩', '🥳', '😎', '🤔', '🤗', '😴', '🥺', '😭', '😤', '🤯', '🫡', '🫶', '💪', '✌️', '👏', '🙌', '🤝', '👍', '❤️', '🔥', '💯', '✨', '🎉', '🌟', '💫', '⚡', '🌈'],
            '🐶': ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🦁', '🐯', '🐸', '🐵', '🐧', '🐦', '🐤', '🦄', '🐉', '🌸', '🌻', '🌹', '🍕', '🍔', '🍟', '🌮', '🍣', '🍩', '☕', '🎮', '🎵', '🎸', '⚽', '🏆', '🎯', '💻'],
            '❤️': ['❤️', '🧡', '💛', '💚', '💙', '💜', '🖤', '🤍', '💔', '❣️', '💕', '💞', '💓', '💗', '💖', '💝', '💘', '🫀', '♥️', '♾️'],
        };

        const emojiTabs = document.getElementById('emojiTabs');
        const emojiGrid = document.getElementById('emojiGrid');
        let activeCat = '😊';

        Object.keys(EMOJI_CATS).forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'emoji-tab-btn' + (cat === activeCat ? ' active' : '');
            btn.textContent = cat; btn.dataset.cat = cat;
            btn.addEventListener('click', () => { activeCat = cat; renderEmojiGrid(); document.querySelectorAll('.emoji-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat)); });
            emojiTabs.appendChild(btn);
        });

        // Emoji search
        const emojiSearchInput = document.getElementById('emojiSearch');
        emojiSearchInput.addEventListener('input', () => {
            const q = emojiSearchInput.value.trim();
            if (!q) { renderEmojiGrid(); return; }
            const ALL_EMOJIS = Object.values(EMOJI_CATS).flat();
            const filtered = ALL_EMOJIS.filter(e => e.includes(q));
            emojiGrid.innerHTML = '';
            (filtered.length ? filtered : ALL_EMOJIS.filter(() => true)).forEach(e => {
                const btn = document.createElement('button');
                btn.className = 'emoji-cell'; btn.textContent = e;
                btn.addEventListener('click', () => { insertEmoji(e); emojiSearchInput.value = ''; });
                emojiGrid.appendChild(btn);
            });
            if (!filtered.length) {
                const msg = document.createElement('div');
                msg.style.cssText = 'grid-column:span 8;text-align:center;font-size:.8rem;color:var(--text-muted);padding:12px 0;';
                msg.textContent = 'لا نتائج 😔';
                emojiGrid.appendChild(msg);
            }
        });
        emojiSearchInput.addEventListener('click', e => e.stopPropagation());

        function renderEmojiGrid() {
            emojiGrid.innerHTML = '';
            EMOJI_CATS[activeCat].forEach(e => {
                const btn = document.createElement('button');
                btn.className = 'emoji-cell'; btn.textContent = e;
                btn.addEventListener('click', () => { insertEmoji(e); });
                emojiGrid.appendChild(btn);
            });
        }
        renderEmojiGrid();

        document.getElementById('emojiTrigger').addEventListener('click', (e) => {
            e.stopPropagation();
            emojiPicker.classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            if (!emojiPicker.contains(e.target) && e.target !== document.getElementById('emojiTrigger')) {
                emojiPicker.classList.remove('open');
            }
        });
        function insertEmoji(e) {
            const pos = messageInput.selectionStart || messageInput.value.length;
            const v = messageInput.value;
            messageInput.value = v.slice(0, pos) + e + v.slice(pos);
            messageInput.focus();
            autoResize();
            updateCharCount();
            emojiPicker.classList.remove('open');
        }

        /* ──────────────────────────────
           CHAR COUNT
        ────────────────────────────── */
        function updateCharCount() {
            const left = 1000 - messageInput.value.length;
            charCount.textContent = left;
            charCount.className = 'char-count' + (left < 50 ? ' limit' : left < 150 ? ' warn' : '');
        }
        messageInput.addEventListener('input', () => { autoResize(); updateCharCount(); sendTypingSignal(); });
        function autoResize() {
            messageInput.style.height = 'auto';
            messageInput.style.height = messageInput.scrollHeight + 'px';
        }

        /* ──────────────────────────────
           TYPING INDICATOR (local simulation)
        ────────────────────────────── */
        let typingSimTimer = null;
        function sendTypingSignal() {
            clearTimeout(typingSimTimer);
            // In a real app you'd write to Firebase presence; here we just simulate
        }

        /* ──────────────────────────────
           IMAGE HANDLING
        ────────────────────────────── */
        triggerFile.addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', () => {
            const file = imageInput.files[0];
            if (!file) return;
            triggerFile.classList.add('has-file');
            imgThumb.src = URL.createObjectURL(file);
            imgPreviewNm.textContent = file.name;
            imgPreviewBar.classList.add('visible');
            messageInput.placeholder = lang === 'ar' ? 'أضف وصفاً... (اختياري)' : 'Add caption... (optional)';
            messageInput.focus();
        });
        window.removeImage = () => {
            imageInput.value = '';
            triggerFile.classList.remove('has-file');
            imgPreviewBar.classList.remove('visible');
            imgThumb.src = '';
            messageInput.placeholder = lang === 'ar' ? 'اكتب رسالتك...' : 'Type a message...';
        };

        /* ──────────────────────────────
           SEND MESSAGE
        ────────────────────────────── */
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            const name = userNameInput.value.trim() || (lang === 'ar' ? 'زائر' : 'Guest');
            const file = imageInput.files[0];
            if (!text && !file) return;
            if (sendBtn.disabled) return;

            sendBtn.disabled = true;
            const origHTML = sendBtn.innerHTML;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                let imageUrl = null;
                if (file) {
                    const snap = await uploadBytes(sRef(storage, 'chat_images/' + Date.now() + '_' + file.name), file);
                    imageUrl = await getDownloadURL(snap.ref);
                }
                const msgData = {
                    name, text, imageUrl,
                    createdAt: serverTimestamp(),
                    createdBy: currentUser?.uid || null,
                    clientId: LOCAL_ID,
                    pinned: false
                };
                if (replyTarget) {
                    msgData.replyTo = {
                        id: replyTarget.id,
                        name: replyTarget.name,
                        text: (replyTarget.text || '').slice(0, 60) + (replyTarget.text?.length > 60 ? '…' : '')
                    };
                }
                await addDoc(msgsCol, msgData);

                messageInput.value = '';
                messageInput.style.height = 'auto';
                updateCharCount();
                removeImage();
                cancelReply();
                localStorage.setItem('chat_name', name);
                setTimeout(() => messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' }), 120);
            } catch (err) {
                showToast('❌ ' + (lang === 'ar' ? 'خطأ في الإرسال' : 'Send error'), 3000, 'error');
                console.error(err);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = origHTML;
                messageInput.focus();
            }
        });

        /* ──────────────────────────────
           AUTH
        ────────────────────────────── */
        signInAnonymously(auth).catch(console.error);
        onAuthStateChanged(auth, user => {
            currentUser = user;
            const dot = document.querySelector('.status-dot');
            if (dot) dot.style.background = user ? '#10b981' : '#f59e0b';
        });

        /* ──────────────────────────────
           RENDER MESSAGES
        ────────────────────────────── */
        let firstLoad = true;
        const q = query(msgsCol, orderBy('createdAt', 'asc'), limit(200));
        onSnapshot(q, snap => {
            const prevLen = allMessages.length;
            allMessages = [];
            snap.forEach(d => allMessages.push({ id: d.id, ...d.data() }));
            // Remove skeleton on first real load
            if (firstLoad) {
                const sk = document.getElementById('skeletonLoader');
                if (sk) sk.remove();
                firstLoad = false;
            }
            // Play sound for new incoming messages
            if (!firstLoad && allMessages.length > prevLen) playReceiveSound();
            renderMessages(allMessages);
            msgCountEl.textContent = allMessages.length;
        }, err => console.error(err));

        function renderMessages(list) {
            const wasAtBottom = (messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight) < 200;
            const scrollPos = messagesEl.scrollTop;

            // Filter out soft-deleted (server) AND optimistically deleted (local) messages
            const visible = list.filter(m => !m.deleted && !locallyDeletedIds.has(m.id));

            // Empty state
            if (visible.length === 0) {
                messagesEl.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">💬</div>
                    <div class="empty-title">${lang === 'ar' ? 'ابدأ المحادثة!' : 'Start the conversation!'}</div>
                    <div class="empty-sub">${lang === 'ar' ? 'كن أوّل من يرسل رسالة في هذه الغرفة 🎉' : 'Be the first to send a message in this room 🎉'}</div>
                    <div class="empty-arrow"><i class="fas fa-arrow-down"></i></div>
                </div>`;
                return;
            }
            messagesEl.innerHTML = '';

            let lastDate = '';
            let lastSender = '';

            visible.forEach((m, idx) => {
                const isMine = (currentUser && m.createdBy === currentUser.uid) || m.clientId === LOCAL_ID;
                const dateStr = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) : '';
                const timeStr = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '';

                // Date divider
                if (dateStr && dateStr !== lastDate) {
                    const div = document.createElement('div');
                    div.className = 'date-divider';
                    div.textContent = dateStr;
                    messagesEl.appendChild(div);
                    lastDate = dateStr;
                    lastSender = '';
                }

                const row = document.createElement('div');
                const isConsecutive = lastSender === (m.name + (isMine ? '_m' : '_o'));
                row.className = `msg ${isMine ? 'mine' : 'other'}${isConsecutive ? ' consecutive' : ''}`;
                row.id = `msg-${m.id}`;
                lastSender = m.name + (isMine ? '_m' : '_o');

                // Avatar
                const [c1, c2] = getAvatarColor(m.name || '?');
                const initials = (m.name || '؟').slice(0, 1).toUpperCase();
                const avatarHTML = `<div class="avatar" style="background:linear-gradient(135deg,${c1},${c2});" title="${escHtml(m.name || '')}">${initials}</div>`;

                // Reply
                let replyHTML = '';
                if (m.replyTo) {
                    replyHTML = `<div class="reply-context" onclick="event.stopPropagation();scrollToMessage('${m.replyTo.id}')">
                <small style="color:var(--accent-primary);font-weight:700;">${escHtml(m.replyTo.name || '')}</small>
                <span>${escHtml(m.replyTo.text || 'مرفق')}</span>
            </div>`;
                }

                // Content
                let contentHTML = '';
                if (m.imageUrl) {
                    contentHTML += `<img src="${m.imageUrl}" class="msg-img" loading="lazy" onclick="event.stopPropagation();openLightbox('${m.imageUrl}')">`;
                }
                if (m.text) {
                    contentHTML += `<span class="bubble-text">${linkify(markdownFormat(escHtml(m.text)))}</span>`;
                }

                // Translation
                let transHTML = '';
                if (m.text && translationMode) {
                    const tid = 'tr_' + m.id;
                    transHTML = `<div class="translation-wrap">
                <div class="translation-label">🌐 ${lang === 'ar' ? 'ترجمة...' : 'Translating...'}</div>
                <div class="msg-translation" id="${tid}"></div>
            </div>`;
                }

                // Reactions
                let reactHTML = '';
                if (m.reactions) {
                    const counts = {};
                    Object.values(m.reactions).forEach(e => { if (e) counts[e] = (counts[e] || 0) + 1; });
                    const txt = Object.entries(counts).map(([k, v]) => `${k}${v > 1 ? ' ' + v : ''}`).join(' ');
                    if (txt) reactHTML = `<div class="reactions-bar" onclick="event.stopPropagation();">${txt}</div>`;
                }

                // Add swipe-reply hint icon
                const swipeHintIcon = isMine ? '↩' : '↪';
                row.innerHTML = `
            <div class="swipe-reply-hint">${swipeHintIcon}</div>
            ${!isConsecutive ? `<span class="sender-name">${escHtml(m.name || 'مستخدم')}</span>` : ''}
            <div class="msg-row">
                ${!isMine ? avatarHTML : ''}
                <div class="bubble">
                    ${replyHTML}
                    ${contentHTML}
                    ${transHTML}
                    <div class="msg-footer">
                        <span class="msg-time">${timeStr}</span>
                        ${isMine ? `<span class="msg-status"><i class="fas fa-check-double"></i></span>` : ''}
                    </div>
                    ${reactHTML}
                </div>
                ${isMine ? avatarHTML : ''}
            </div>`;

                const bubble = row.querySelector('.bubble');
                bubble.addEventListener('click', (e) => {
                    if (e.target.tagName === 'A' || e.target.closest('.reply-context')) return;
                    openActions(m, m.id, isMine);
                });

                // Swipe to reply (touch)
                let touchStartX = 0;
                row.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; row.classList.remove('swiping'); }, { passive: true });
                row.addEventListener('touchmove', e => {
                    const dx = e.touches[0].clientX - touchStartX;
                    const threshold = 40;
                    if (Math.abs(dx) > threshold) row.classList.add('swiping');
                    else row.classList.remove('swiping');
                }, { passive: true });
                row.addEventListener('touchend', e => {
                    const dx = e.changedTouches[0].clientX - touchStartX;
                    row.classList.remove('swiping');
                    if (Math.abs(dx) > 60) {
                        window.replyTarget = { id: m.id, name: m.name, text: m.text };
                        document.getElementById('replyToName').textContent = m.name || 'مستخدم';
                        document.getElementById('replyTextPreview').textContent = m.text || '[صورة]';
                        replyPreview.classList.add('visible');
                        window.replyTarget = { id: m.id, name: m.name, text: m.text };
                        replyTarget = window.replyTarget;
                        messageInput.focus();
                        showToast('↩ ' + (lang === 'ar' ? 'رد على الرسالة' : 'Replying'), 1800, 'info');
                    }
                }, { passive: true });

                messagesEl.appendChild(row);

                // Translation fetch
                if (m.text && translationMode) {
                    const tgt = lang === 'ar' ? 'en' : 'ar';
                    translateText(m.text, tgt).then(translated => {
                        const el = document.getElementById('tr_' + m.id);
                        if (el) el.textContent = translated;
                    });
                }
            });

            updatePinnedBanner();
            if (searchActive) doSearch();

            if (wasAtBottom) {
                messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
                newMsgCount = 0;
                newMsgBadge.style.display = 'none';
            } else if (!wasAtBottom && list.length > 0) {
                newMsgCount++;
                if (newMsgCount > 0) {
                    newMsgBadge.textContent = newMsgCount;
                    newMsgBadge.style.display = 'flex';
                }
            }
        }

        /* ──────────────────────────────
           SCROLL HANDLING
        ────────────────────────────── */
        messagesEl.addEventListener('scroll', () => {
            const dist = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
            isScrolledUp = dist > 180;
            scrollFab.classList.toggle('visible', isScrolledUp);
            if (!isScrolledUp) { newMsgCount = 0; newMsgBadge.style.display = 'none'; }
        });
        scrollFab.addEventListener('click', () => {
            messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
            newMsgCount = 0; newMsgBadge.style.display = 'none';
        });

        /* ──────────────────────────────
           ACTIONS
        ────────────────────────────── */
        window.openActions = (msgData, msgId, isMine) => {
            selectedMsg = { ...msgData, id: msgId };
            deleteBtn.style.display = isMine ? 'flex' : 'none';
            document.getElementById('modalMsgText').textContent = (msgData.text || '[صورة]').slice(0, 80);
            pinBtn.innerHTML = `<i class="fas fa-thumbtack"></i> ${pinnedMsgId === msgId ? (lang === 'ar' ? 'إلغاء التثبيت' : 'Unpin') : (lang === 'ar' ? 'تثبيت الرسالة' : 'Pin message')}`;
            actionModal.classList.add('open');
        };
        window.closeActions = () => { actionModal.classList.remove('open'); selectedMsg = null; };

        window.addReaction = async (emoji) => {
            if (!selectedMsg) return;
            const docRef = doc(db, 'public_messages', selectedMsg.id);
            const cur = selectedMsg.reactions?.[LOCAL_ID];
            try {
                await updateDoc(docRef, { [`reactions.${LOCAL_ID}`]: cur === emoji ? null : emoji });
                closeActions();
                showToast(cur === emoji ? '💔 أزلت التفاعل' : `${emoji} تفاعلت`, 2000, 'info');
            } catch (e) { console.error(e); }
        };

        window.replyToMessage = () => {
            if (!selectedMsg) return;
            replyTarget = selectedMsg;
            document.getElementById('replyToName').textContent = selectedMsg.name || 'مستخدم';
            document.getElementById('replyTextPreview').textContent = selectedMsg.text || '[صورة]';
            replyPreview.classList.add('visible');
            closeActions();
            messageInput.focus();
        };

        window.copyMessage = () => {
            if (!selectedMsg?.text) { showToast('📋 لا يوجد نص للنسخ', 2200, 'warn'); closeActions(); return; }
            navigator.clipboard?.writeText(selectedMsg.text).then(() => showToast('📋 تم نسخ الرسالة', 2000, 'success'));
            closeActions();
        };

        window.togglePin = async () => {
            if (!selectedMsg) return;
            pinnedMsgId = pinnedMsgId === selectedMsg.id ? null : selectedMsg.id;
            localStorage.setItem('chat_pinned', pinnedMsgId || '');
            updatePinnedBanner();
            showToast(pinnedMsgId ? '📌 تم تثبيت الرسالة' : '📌 تم إلغاء التثبيت', 2200, 'info');
            closeActions();
        };

        window.deleteMessage = async () => {
            if (!selectedMsg) return;
            const msgId = selectedMsg.id;
            if (!confirm(lang === 'ar' ? 'هل أنت متأكد من حذف الرسالة؟' : 'Delete this message?')) return;

            const ref = doc(db, 'public_messages', msgId);
            
            // Optimistic UI: Hide immediately
            locallyDeletedIds.add(msgId);
            renderMessages(allMessages);
            closeActions();

            try {
                // Try soft-delete first
                await updateDoc(ref, { deleted: true, deletedAt: serverTimestamp() });
                if (pinnedMsgId === msgId) { pinnedMsgId = null; localStorage.removeItem('chat_pinned'); updatePinnedBanner(); }
                showToast('🗑️ تم حذف الرسالة بنجاح', 2200, 'success');
            } catch (updateErr) {
                try {
                    // Fallback to hard delete
                    await deleteDoc(ref);
                    if (pinnedMsgId === msgId) { pinnedMsgId = null; localStorage.removeItem('chat_pinned'); updatePinnedBanner(); }
                    showToast('🗑️ تم الحذف نهائياً', 2200, 'success');
                } catch (deleteErr) {
                    // Revert optimism on failure
                    locallyDeletedIds.delete(msgId);
                    renderMessages(allMessages);
                    
                    console.error('Permission Error:', deleteErr);
                    if (deleteErr.code === 'permission-denied') {
                        showToast('❌ فشل بسبب الصلاحيات! يرجى مراجعة Firestore Rules', 5000, 'error');
                        alert(lang === 'ar' ? 
                            'خطأ في Firebase: "Permission Denied".\nيرجى فتح واجهة Firebase Console وتعديل الـ Rules للسماح بالحذف.' : 
                            'Firebase Permission Denied.\nPlease check your Firestore Rules to allow deletion.');
                    } else {
                        showToast('❌ فشل الحذف: ' + deleteErr.message, 3500, 'error');
                    }
                }
            }
        };

        window.cancelReply = () => {
            replyTarget = null;
            replyPreview.classList.remove('visible');
        };

        /* ──────────────────────────────
           SCROLL TO MESSAGE
        ────────────────────────────── */
        window.scrollToMessage = (id) => {
            const el = document.getElementById('msg-' + id);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('highlight-msg');
                setTimeout(() => el.classList.remove('highlight-msg'), 1200);
            }
        };

        /* ──────────────────────────────
           LIGHTBOX
        ────────────────────────────── */
        window.openLightbox = (src) => {
            lightboxImg.src = src;
            lightbox.classList.add('open');
        };
        window.closeLightbox = () => lightbox.classList.remove('open');

        /* ──────────────────────────────
           TOAST (color-coded)
        ────────────────────────────── */
        function showToast(msg, duration = 2800, type = '') {
            const el = document.createElement('div');
            el.className = 'toast' + (type ? ' ' + type : '');
            el.textContent = msg;
            document.getElementById('toastWrap').appendChild(el);
            setTimeout(() => { el.classList.add('removing'); setTimeout(() => el.remove(), 320); }, duration);
        }

        /* ──────────────────────────────
           CLOSE MODAL ON OUTSIDE CLICK
        ────────────────────────────── */
        actionModal.addEventListener('click', (e) => {
            if (e.target === actionModal) closeActions();
        });

        /* ──────────────────────────────
           HELPERS
        ────────────────────────────── */
        function escHtml(t) {
            return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function linkify(t) {
            return t.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;word-break:break-all;">$1</a>');
        }
        // Markdown: **bold**, _italic_, `code`
        function markdownFormat(t) {
            return t
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\_(.+?)\_/g, '<em>$1</em>')
                .replace(/`(.+?)`/g, '<code>$1</code>');
        }

        /* ──────────────────────────────
           RESTORE SAVED DATA
        ────────────────────────────── */
        const savedName = localStorage.getItem('chat_name');
        if (savedName) userNameInput.value = savedName;
        updateCharCount();

        /* ──────────────────────────────
           KEYBOARD SHORTCUTS
        ────────────────────────────── */
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
            if (e.key === 'Escape') {
                cancelReply();
                emojiPicker.classList.remove('open');
            }
        });
        // Ctrl+K / Cmd+K → open search
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                if (!searchActive) toggleSearch();
                else closeSearch();
            }
        });

        /* ──────────────────────────────
           SIMULATED ONLINE COUNT (local only)
        ────────────────────────────── */
        function updateOnlineCount() {
            const base = 1 + Math.floor(Math.random() * 4);
            document.getElementById('onlineCount').textContent = base;
        }
        updateOnlineCount();
        setInterval(updateOnlineCount, 30000);

        /* ──────────────────────────────
           PARTICLE CANVAS
        ────────────────────────────── */
        (function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];
            const N = 55;
            const COLORS = ['59,130,246', '139,92,246', '6,182,212'];

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize); resize();

            for (let i = 0; i < N; i++) particles.push({
                x: Math.random() * 1, y: Math.random() * 1,
                r: .5 + Math.random() * 1.8,
                vx: (Math.random() - .5) * .0003,
                vy: (Math.random() - .5) * .0003,
                alpha: .15 + Math.random() * .5,
                color: COLORS[Math.floor(Math.random() * COLORS.length)]
            });

            function draw() {
                ctx.clearRect(0, 0, W, H);
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0) p.x = 1; if (p.x > 1) p.x = 0;
                    if (p.y < 0) p.y = 1; if (p.y > 1) p.y = 0;
                    ctx.beginPath();
                    ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
                    ctx.fill();
                });
                // Draw connection lines between nearby particles
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = (particles[i].x - particles[j].x) * W;
                        const dy = (particles[i].y - particles[j].y) * H;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x * W, particles[i].y * H);
                            ctx.lineTo(particles[j].x * W, particles[j].y * H);
                            ctx.strokeStyle = `rgba(${particles[i].color},${.07 * (1 - dist / 120)})`;
                            ctx.lineWidth = .6;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

    </script>
</body>
