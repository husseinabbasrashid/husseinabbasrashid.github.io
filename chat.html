        const pinBtn = document.getElementById('pinBtn');
        const replyPreview = document.getElementById('replyPreview');
        const emojiPicker = document.getElementById('emojiPicker');
        const pinnedBanner = document.getElementById('pinnedBanner');
        const pinnedText = document.getElementById('pinnedText');
        const charCount = document.getElementById('charCount');
        const typingEl = document.getElementById('typingIndicator');
        const typingText = document.getElementById('typingText');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        /* ──────────────────────────────
           THEME
        ────────────────────────────── */
        const themeBtn = document.getElementById('themeToggle');
        const themeIcon = themeBtn.querySelector('i');
        if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light'); themeIcon.className = 'fas fa-sun'; }
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light');
            const light = document.body.classList.contains('light');
            themeIcon.className = light ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('theme', light ? 'light' : 'dark');
        });

        /* ──────────────────────────────
           SOUND TOGGLE
        ────────────────────────────── */
        let soundEnabled = localStorage.getItem('chat_sound') !== 'false';
        const soundBtn = document.getElementById('soundToggle');
        const soundIcon = soundBtn.querySelector('i');
        function applySoundUI() {
            soundIcon.className = soundEnabled ? 'fas fa-volume-high' : 'fas fa-volume-xmark';
            soundBtn.classList.toggle('muted', !soundEnabled);
            soundBtn.dataset.tip = soundEnabled ? 'كتم الصوت' : 'تشغيل الصوت';
        }
        applySoundUI();
        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            localStorage.setItem('chat_sound', soundEnabled);
            applySoundUI();
            showToast(soundEnabled ? '🔔 تم تفعيل الإشعارات الصوتية' : '🔕 تم كتم الصوت', 2200, 'info');
        });

        // Notification sound (short beep via Web Audio API)
        let audioCtx = null;
        function playReceiveSound() {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
                osc.start(); osc.stop(audioCtx.currentTime + 0.28);
            } catch (e) { }
        }

        /* ──────────────────────────────
           LANGUAGE
        ────────────────────────────── */
        const langToggle = document.getElementById('langToggle');
        const langLabel = document.getElementById('langLabel');
        let lang = localStorage.getItem('chat_lang') || 'ar';
        applyLang(lang);

        langToggle.addEventListener('click', () => {
            lang = lang === 'ar' ? 'en' : 'ar';
            applyLang(lang);
            localStorage.setItem('chat_lang', lang);
        });
        function applyLang(l) {
            document.documentElement.lang = l;
            document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
            langLabel.textContent = l === 'ar' ? 'ع' : 'EN';
            document.getElementById('roomTitle').textContent = activeRoomCode
                ? (l === 'ar' ? 'غرفة خاصة 🔒' : 'Private Room 🔒')
                : (l === 'ar' ? 'نقاش عام' : 'Public Chat');
            const statusLabel = document.getElementById('statusText');
            statusLabel.textContent = currentUser ? (l === 'ar' ? 'متصل' : 'Connected') : (l === 'ar' ? 'جارٍ الاتصال' : 'Connecting');
            document.querySelectorAll('.composer-hints [data-ar]').forEach(el => {
                el.textContent = l === 'ar' ? el.dataset.ar : el.dataset.en;
            });
            messageInput.placeholder = l === 'ar' ? 'اكتب رسالتك...' : 'Type a message...';
            userNameInput.placeholder = l === 'ar' ? 'اسمك' : 'Name';
            document.getElementById('privateRoomBtn').title = l === 'ar' ? 'غرفة خاصة' : 'Private room';
            document.getElementById('roomModalTitle').textContent = l === 'ar' ? 'غرفة خاصة برمز' : 'Private room with a code';
            document.getElementById('roomModalHelp').textContent = l === 'ar'
                ? 'أنشئ غرفة وشارك رمزها مع من تريد. كل من يملك الرمز يستطيع الدخول.'
                : 'Create a room and share its code. Anyone with the code can join.';
            document.getElementById('roomCodeLabel').textContent = l === 'ar' ? 'رمز الغرفة' : 'Room code';
            roomCodeInput.placeholder = l === 'ar' ? 'XXXX-XXXX-XXXX' : 'XXXX-XXXX-XXXX';
            document.getElementById('joinRoomBtn').textContent = l === 'ar' ? 'دخول بالرمز' : 'Join with code';
            document.getElementById('createRoomBtn').textContent = l === 'ar' ? 'إنشاء غرفة ورمز' : 'Create room and code';
            document.getElementById('roomCodeResultLabel').textContent = l === 'ar' ? 'رمز مشاركة الغرفة (احتفظ به):' : 'Room sharing code (keep it safe):';
            document.getElementById('copyRoomCodeBtn').textContent = l === 'ar' ? 'نسخ الرمز' : 'Copy code';
            document.getElementById('closeRoomModalBtn').textContent = l === 'ar' ? 'إغلاق' : 'Close';
            document.getElementById('leaveRoomBtn').textContent = l === 'ar' ? 'العودة للنقاش العام' : 'Return to public chat';
        }

        const privateRoomBtn = document.getElementById('privateRoomBtn');
        privateRoomBtn.addEventListener('click', () => {
            roomCodeResult.classList.remove('visible');
            roomCodeInput.value = '';
            roomModal.classList.add('open');
        });
        document.getElementById('closeRoomModalBtn').addEventListener('click', () => roomModal.classList.remove('open'));
        roomModal.addEventListener('click', e => { if (e.target === roomModal) roomModal.classList.remove('open'); });
        document.getElementById('createRoomBtn').addEventListener('click', createPrivateRoom);
        document.getElementById('joinRoomBtn').addEventListener('click', joinPrivateRoom);
        document.getElementById('leaveRoomBtn').addEventListener('click', leavePrivateRoom);
        document.getElementById('copyRoomCodeBtn').addEventListener('click', async () => {
            const code = document.getElementById('roomCodeValue').textContent;
            try {
                await navigator.clipboard.writeText(code);
                showToast(lang === 'ar' ? 'تم نسخ رمز الغرفة' : 'Room code copied', 2200, 'success');
            } catch { showToast(lang === 'ar' ? 'انسخ الرمز يدوياً' : 'Copy the code manually', 2600, 'warn'); }
        });

        const ROOM_CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        function generateRoomCode() {
            const bytes = crypto.getRandomValues(new Uint8Array(12));
            return Array.from(bytes, b => ROOM_CODE_ALPHABET[b % ROOM_CODE_ALPHABET.length]).join('');
        }

        async function createPrivateRoom() {
            if (!currentUser) {
                showToast(lang === 'ar' ? 'انتظر اتصال Firebase ثم حاول مجدداً' : 'Wait for Firebase to connect, then try again', 3000, 'warn');
                return;
            }
            const code = generateRoomCode();
            try {
                await setDoc(doc(db, 'private_rooms', code), { createdBy: currentUser.uid, createdAt: serverTimestamp() });
                await enterPrivateRoom(code);
                document.getElementById('roomCodeValue').textContent = code.match(/.{1,4}/g).join('-');
                roomCodeResult.classList.add('visible');
            } catch (err) {
                console.error(err);
                showToast(lang === 'ar' ? 'تعذر إنشاء الغرفة. قد تحتاج قواعد Firestore إلى تحديث.' : 'Could not create the room. Firestore rules may need updating.', 4200, 'error');
            }
        }

        async function joinPrivateRoom() {
            if (!currentUser) {
                showToast(lang === 'ar' ? 'انتظر اتصال Firebase ثم حاول مجدداً' : 'Wait for Firebase to connect, then try again', 3000, 'warn');
                return;
            }
            const code = roomCodeInput.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
            if (code.length !== 12) {
                showToast(lang === 'ar' ? 'تأكد من إدخال رمز الغرفة كاملاً' : 'Enter the complete room code', 2800, 'warn');
                return;
            }
            try {
                const room = await getDoc(doc(db, 'private_rooms', code));
                if (!room.exists()) {
                    showToast(lang === 'ar' ? 'الرمز غير صحيح أو الغرفة غير موجودة' : 'Invalid code or room not found', 3000, 'error');
                    return;
                }
                await enterPrivateRoom(code);
                roomModal.classList.remove('open');
            } catch (err) {
                console.error(err);
                showToast(lang === 'ar' ? 'تعذر فتح الغرفة. تحقق من قواعد Firestore.' : 'Could not open room. Check Firestore rules.', 4000, 'error');
            }
        }

        async function enterPrivateRoom(code) {
            activeRoomCode = code;
            msgsCol = collection(db, 'private_rooms', code, 'messages');
            localStorage.setItem('chat_private_room', code);
            applyLang(lang);
            if (currentUser) listenToCurrentRoom();
        }

        function leavePrivateRoom() {
            activeRoomCode = null;
            msgsCol = PUBLIC_MESSAGES;
            localStorage.removeItem('chat_private_room');
            roomModal.classList.remove('open');
            applyLang(lang);
            if (currentUser) listenToCurrentRoom();
        }

        /* ──────────────────────────────
           TRANSLATION
        ────────────────────────────── */
        const translateBtn = document.getElementById('translateBtn');
        setTranslateUI();
        translateBtn.addEventListener('click', () => {
            translationMode = !translationMode;
            localStorage.setItem('translation_mode', translationMode);
            setTranslateUI();
            showToast(translationMode ? '🌐 الترجمة التلقائية مفعّلة' : '🌐 الترجمة معطّلة');
            renderMessages(allMessages); // re-render
        });
        function setTranslateUI() {
            translateBtn.dataset.active = translationMode;
        }

        async function translateText(text, targetLang) {
            try {
                const src = targetLang === 'en' ? 'ar' : 'en';
                const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${src}|${targetLang}`);
                const d = await r.json();
                return d.responseStatus === 200 ? d.responseData.translatedText : text;
            } catch { return text; }
        }

        /* ──────────────────────────────
           SEARCH
        ────────────────────────────── */
        const searchBarWrap = document.getElementById('searchBarWrap');
        const searchInput = document.getElementById('searchInput');
        const searchCount = document.getElementById('searchCount');

        document.getElementById('searchBtn').addEventListener('click', toggleSearch);
        function toggleSearch() {
            searchActive = !searchActive;
            searchBarWrap.classList.toggle('open', searchActive);
            if (searchActive) { setTimeout(() => searchInput.focus(), 350); }
            else { searchInput.value = ''; searchCount.textContent = ''; clearSearchHighlights(); }
        }
        function closeSearch() { searchActive = false; searchBarWrap.classList.remove('open'); searchInput.value = ''; searchCount.textContent = ''; clearSearchHighlights(); }

        searchInput.addEventListener('input', debounce(doSearch, 300));
        function doSearch() {
            const q = searchInput.value.trim().toLowerCase();
            clearSearchHighlights();
            if (!q) { searchCount.textContent = ''; return; }
            searchResults = [];
            messagesEl.querySelectorAll('.msg').forEach(el => {
                const text = el.querySelector('.bubble-text')?.textContent?.toLowerCase() || '';
                if (text.includes(q)) { searchResults.push(el); el.classList.add('highlight-msg'); }
            });
            searchCount.textContent = searchResults.length ? `${searchResults.length} نتيجة` : 'لا نتائج';
            if (searchResults[0]) searchResults[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        function clearSearchHighlights() { messagesEl.querySelectorAll('.highlight-msg').forEach(e => e.classList.remove('highlight-msg')); }
        function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

        /* ──────────────────────────────
           PINNED MESSAGE
        ────────────────────────────── */
        function updatePinnedBanner() {
            if (!pinnedMsgId) { pinnedBanner.classList.remove('visible'); return; }
            const msg = allMessages.find(m => m.id === pinnedMsgId);
            if (!msg) { pinnedBanner.classList.remove('visible'); return; }
            pinnedText.innerHTML = `<strong>${escHtml(msg.name || 'مستخدم')}:</strong> ${escHtml((msg.text || '').slice(0, 80))}`;
            pinnedBanner.classList.add('visible');
        }
        pinnedBanner.addEventListener('click', () => {
            if (pinnedMsgId) scrollToMessage(pinnedMsgId);
        });

        /* ──────────────────────────────
           EMOJI PICKER
        ────────────────────────────── */

            '😊': ['😊', '😂', '🥲', '😅', '😆', '😍', '🥰', '😘', '😋', '😜', '🤩', '🥳', '😎', '🤔', '🤗', '😴', '🥺', '😭', '😤', '🤯', '🫡', '🫶', '💪', '✌️', '👏', '🙌', '🤝', '👍', '❤️', '🔥', '💯', '✨', '🎉', '🌟', '💫', '⚡', '🌈'],
            '🐶': ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🦁', '🐯', '🐸', '🐵', '🐧', '🐦', '🐤', '🦄', '🐉', '🌸', '🌻', '🌹', '🍕', '🍔', '🍟', '🌮', '🍣', '🍩', '☕', '🎮', '🎵', '🎸', '⚽', '🏆', '🎯', '💻'],
            '❤️': ['❤️', '🧡', '💛', '💚', '💙', '💜', '🖤', '🤍', '💔', '❣️', '💕', '💞', '💓', '💗', '💖', '💝', '💘', '🫀', '♥️', '♾️'],
        };

        const emojiTabs = document.getElementById('emojiTabs');
        const emojiGrid = document.getElementById('emojiGrid');
        let activeCat = '😊';

        Object.keys(EMOJI_CATS).forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'emoji-tab-btn' + (cat === activeCat ? ' active' : '');
            btn.textContent = cat; btn.dataset.cat = cat;
            btn.addEventListener('click', () => { activeCat = cat; renderEmojiGrid(); document.querySelectorAll('.emoji-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat)); });
            emojiTabs.appendChild(btn);
        });

        // Emoji search
        const emojiSearchInput = document.getElementById('emojiSearch');
        emojiSearchInput.addEventListener('input', () => {
            const q = emojiSearchInput.value.trim();
            if (!q) { renderEmojiGrid(); return; }
            const ALL_EMOJIS = Object.values(EMOJI_CATS).flat();
            const filtered = ALL_EMOJIS.filter(e => e.includes(q));
            emojiGrid.innerHTML = '';
            (filtered.length ? filtered : ALL_EMOJIS.filter(() => true)).forEach(e => {
                const btn = document.createElement('button');
                btn.className = 'emoji-cell'; btn.textContent = e;
                btn.addEventListener('click', () => { insertEmoji(e); emojiSearchInput.value = ''; });
                emojiGrid.appendChild(btn);
            });
            if (!filtered.length) {
                const msg = document.createElement('div');
                msg.style.cssText = 'grid-column:span 8;text-align:center;font-size:.8rem;color:var(--text-muted);padding:12px 0;';
                msg.textContent = 'لا نتائج 😔';
                emojiGrid.appendChild(msg);
            }
        });
        emojiSearchInput.addEventListener('click', e => e.stopPropagation());

        function renderEmojiGrid() {
            emojiGrid.innerHTML = '';
            EMOJI_CATS[activeCat].forEach(e => {
                const btn = document.createElement('button');
                btn.className = 'emoji-cell'; btn.textContent = e;
                btn.addEventListener('click', () => { insertEmoji(e); });
                emojiGrid.appendChild(btn);
            });
        }
        renderEmojiGrid();

        document.getElementById('emojiTrigger').addEventListener('click', (e) => {
            e.stopPropagation();
            emojiPicker.classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            if (!emojiPicker.contains(e.target) && e.target !== document.getElementById('emojiTrigger')) {
                emojiPicker.classList.remove('open');
            }
        });
        function insertEmoji(e) {
            const pos = messageInput.selectionStart || messageInput.value.length;
            const v = messageInput.value;
            messageInput.value = v.slice(0, pos) + e + v.slice(pos);
            messageInput.focus();
            autoResize();
            updateCharCount();
            emojiPicker.classList.remove('open');
        }

        /* ──────────────────────────────
           CHAR COUNT
        ────────────────────────────── */
        function updateCharCount() {
            const left = 1000 - messageInput.value.length;
            charCount.textContent = left;
            charCount.className = 'char-count' + (left < 50 ? ' limit' : left < 150 ? ' warn' : '');
        }
        messageInput.addEventListener('input', () => { autoResize(); updateCharCount(); sendTypingSignal(); });
        function autoResize() {
            messageInput.style.height = 'auto';
            messageInput.style.height = messageInput.scrollHeight + 'px';
        }

        /* ──────────────────────────────
           TYPING INDICATOR (local simulation)
        ────────────────────────────── */
        let typingSimTimer = null;
        function sendTypingSignal() {
            clearTimeout(typingSimTimer);
            // In a real app you'd write to Firebase presence; here we just simulate
        }

        /* ──────────────────────────────
           IMAGE HANDLING
        ────────────────────────────── */
        triggerFile.addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', () => {
            const file = imageInput.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                window.removeImage();
                showToast(lang === 'ar' ? 'اختر ملف صورة صالحاً' : 'Choose a valid image file', 3000, 'error');
                return;
            }
            if (file.size > MAX_IMAGE_SIZE) {
                window.removeImage();
                showToast(lang === 'ar' ? 'حجم الصورة يجب ألا يتجاوز 5 ميغابايت' : 'Image must be 5 MB or smaller', 3500, 'warn');
                return;
            }
            triggerFile.classList.add('has-file');
            imgThumb.src = URL.createObjectURL(file);
            imgPreviewNm.textContent = file.name;
            imgPreviewBar.classList.add('visible');
            messageInput.placeholder = lang === 'ar' ? 'أضف وصفاً... (اختياري)' : 'Add caption... (optional)';
            messageInput.focus();
        });
        window.removeImage = () => {
            if (imgThumb.src.startsWith('blob:')) URL.revokeObjectURL(imgThumb.src);
            imageInput.value = '';
            triggerFile.classList.remove('has-file');
            imgPreviewBar.classList.remove('visible');
            imgThumb.src = '';
            messageInput.placeholder = lang === 'ar' ? 'اكتب رسالتك...' : 'Type a message...';
        };

        /* ──────────────────────────────
           SEND MESSAGE
        ────────────────────────────── */
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            const name = userNameInput.value.trim() || (lang === 'ar' ? 'زائر' : 'Guest');
            const file = imageInput.files[0];
            if (!text && !file) return;
            if (sendBtn.disabled) return;

            sendBtn.disabled = true;
            const origHTML = sendBtn.innerHTML;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                let imageUrl = null;
                if (file) {
                    if (IMAGE_UPLOAD_ENDPOINT.includes('YOUR-WORKER')) {
                        throw new Error('Image upload endpoint is not configured yet.');
                    }
                    const uploadData = new FormData();
                    uploadData.append('image', file, file.name);
                    const response = await fetch(IMAGE_UPLOAD_ENDPOINT, {
                        method: 'POST',
                        body: uploadData
                    });
                    const uploaded = await response.json();
                    if (!response.ok || !uploaded.url) {
                        throw new Error(uploaded.error || 'Image upload failed.');
                    }
                    imageUrl = uploaded.url;
                }
                const msgData = {
                    name, text, imageUrl,
                    createdAt: serverTimestamp(),
                    createdBy: currentUser?.uid || null,
                    clientId: LOCAL_ID,
                    pinned: false
                };
                if (replyTarget) {
                    msgData.replyTo = {
                        id: replyTarget.id,
                        name: replyTarget.name,
                        text: (replyTarget.text || '').slice(0, 60) + (replyTarget.text?.length > 60 ? '…' : '')
                    };
                }
                await addDoc(msgsCol, msgData);

                messageInput.value = '';
                messageInput.style.height = 'auto';
                updateCharCount();
                removeImage();
                cancelReply();
                localStorage.setItem('chat_name', name);
                setTimeout(() => messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' }), 120);
            } catch (err) {
                showToast('❌ ' + (lang === 'ar' ? 'خطأ في الإرسال' : 'Send error'), 3000, 'error');
                console.error(err);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = origHTML;
                messageInput.focus();
            }
        });

        /* ──────────────────────────────
           AUTH
        ────────────────────────────── */
        signInAnonymously(auth).catch(console.error);
        onAuthStateChanged(auth, user => {
            currentUser = user;
            const dot = document.querySelector('.status-dot');
            if (dot) dot.style.background = user ? '#10b981' : '#f59e0b';
            const badge = document.getElementById('connectionBadge');
            const statusText = document.getElementById('statusText');
            badge?.classList.toggle('is-offline', !user);
            if (statusText) statusText.textContent = user ? (lang === 'ar' ? 'متصل' : 'Connected') : (lang === 'ar' ? 'جارٍ الاتصال' : 'Connecting');
            if (user) listenToCurrentRoom();
        });

        /* ──────────────────────────────
           RENDER MESSAGES
        ────────────────────────────── */
        let firstLoad = true;
        let stopMessagesListener = null;
        function listenToCurrentRoom() {
            if (stopMessagesListener) stopMessagesListener();
            firstLoad = true;
            allMessages = [];
            locallyDeletedIds.clear();
            messagesEl.innerHTML = '<div class="skeleton-wrap"><div class="skeleton-row"><div class="skeleton-avatar"></div><div class="skeleton-bubble" style="width:55%"></div></div></div>';
            const q = query(msgsCol, orderBy('createdAt', 'asc'), limit(200));
            stopMessagesListener = onSnapshot(q, snap => {
                const wasInitial = firstLoad;
                const prevLen = allMessages.length;
                allMessages = [];
                snap.forEach(d => allMessages.push({ id: d.id, ...d.data() }));
                if (firstLoad) {
                    firstLoad = false;
                    if (!activeRoomCode) document.getElementById('skeletonLoader')?.remove();
                }
                if (!wasInitial && allMessages.length > prevLen) playReceiveSound();
                renderMessages(allMessages);
                msgCountEl.textContent = allMessages.length;
            }, err => {
                console.error(err);
                messagesEl.innerHTML = `<div class="empty-state"><div class="empty-icon">🔒</div><div class="empty-title">${lang === 'ar' ? 'تعذر فتح الغرفة' : 'Could not open room'}</div><div class="empty-sub">${lang === 'ar' ? 'تأكد من الرمز ومن إعداد قواعد Firestore للغرف الخاصة.' : 'Check the code and Firestore rules for private rooms.'}</div></div>`;
            });
        }

        function renderMessages(list) {
            const wasAtBottom = (messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight) < 200;
            const scrollPos = messagesEl.scrollTop;

            // Filter out soft-deleted (server) AND optimistically deleted (local) messages
            const visible = list.filter(m => !m.deleted && !locallyDeletedIds.has(m.id));

            // Empty state
            if (visible.length === 0) {
                messagesEl.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">💬</div>
                    <div class="empty-title">${lang === 'ar' ? 'ابدأ المحادثة!' : 'Start the conversation!'}</div>
                    <div class="empty-sub">${lang === 'ar' ? 'كن أوّل من يرسل رسالة في هذه الغرفة 🎉' : 'Be the first to send a message in this room 🎉'}</div>
                    <div class="empty-arrow"><i class="fas fa-arrow-down"></i></div>
                </div>`;
                return;
            }
            messagesEl.innerHTML = '';

            let lastDate = '';
            let lastSender = '';

            visible.forEach((m, idx) => {
                const isMine = (currentUser && m.createdBy === currentUser.uid) || m.clientId === LOCAL_ID;
                const dateStr = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) : '';
                const timeStr = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '';

                // Date divider
                if (dateStr && dateStr !== lastDate) {
                    const div = document.createElement('div');
                    div.className = 'date-divider';
                    div.textContent = dateStr;
                    messagesEl.appendChild(div);
                    lastDate = dateStr;
                    lastSender = '';
                }

                const row = document.createElement('div');
                const isConsecutive = lastSender === (m.name + (isMine ? '_m' : '_o'));
                row.className = `msg ${isMine ? 'mine' : 'other'}${isConsecutive ? ' consecutive' : ''}`;
                row.id = `msg-${m.id}`;
                lastSender = m.name + (isMine ? '_m' : '_o');

                // Avatar
                const [c1, c2] = getAvatarColor(m.name || '?');
                const initials = (m.name || '؟').slice(0, 1).toUpperCase();
                const avatarHTML = `<div class="avatar" style="background:linear-gradient(135deg,${c1},${c2});" title="${escHtml(m.name || '')}">${initials}</div>`;

                // Reply
                let replyHTML = '';
                if (m.replyTo) {
                    replyHTML = `<div class="reply-context" onclick="event.stopPropagation();scrollToMessage('${m.replyTo.id}')">
                <small style="color:var(--accent-primary);font-weight:700;">${escHtml(m.replyTo.name || '')}</small>
                <span>${escHtml(m.replyTo.text || 'مرفق')}</span>
            </div>`;
                }

                // Content
                let contentHTML = '';
                if (m.imageUrl) {
                    contentHTML += `<img src="${m.imageUrl}" class="msg-img" loading="lazy" onclick="event.stopPropagation();openLightbox('${m.imageUrl}')">`;
                }
                if (m.text) {
                    contentHTML += `<span class="bubble-text">${linkify(markdownFormat(escHtml(m.text)))}</span>`;
                }

                // Translation
                let transHTML = '';
                if (m.text && translationMode) {
                    const tid = 'tr_' + m.id;
                    transHTML = `<div class="translation-wrap">
                <div class="translation-label">🌐 ${lang === 'ar' ? 'ترجمة...' : 'Translating...'}</div>
                <div class="msg-translation" id="${tid}"></div>
            </div>`;
                }

                // Reactions
                let reactHTML = '';
                if (m.reactions) {
                    const counts = {};
                    Object.values(m.reactions).forEach(e => { if (e) counts[e] = (counts[e] || 0) + 1; });
                    const txt = Object.entries(counts).map(([k, v]) => `${k}${v > 1 ? ' ' + v : ''}`).join(' ');
                    if (txt) reactHTML = `<div class="reactions-bar" onclick="event.stopPropagation();">${txt}</div>`;
                }

                // Add swipe-reply hint icon
                const swipeHintIcon = isMine ? '↩' : '↪';
                row.innerHTML = `
            <div class="swipe-reply-hint">${swipeHintIcon}</div>
            ${!isConsecutive ? `<span class="sender-name">${escHtml(m.name || 'مستخدم')}</span>` : ''}
            <div class="msg-row">
                ${!isMine ? avatarHTML : ''}
                <div class="bubble">
                    ${replyHTML}
                    ${contentHTML}
                    ${transHTML}
                    <div class="msg-footer">
                        <span class="msg-time">${timeStr}</span>
                        ${isMine ? `<span class="msg-status"><i class="fas fa-check-double"></i></span>` : ''}
                    </div>
                    ${reactHTML}
                </div>
                ${isMine ? avatarHTML : ''}
            </div>`;

                const bubble = row.querySelector('.bubble');
                bubble.addEventListener('click', (e) => {
                    if (e.target.tagName === 'A' || e.target.closest('.reply-context')) return;
                    openActions(m, m.id, isMine);
                });

                // Swipe to reply (touch)
                let touchStartX = 0;
                row.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; row.classList.remove('swiping'); }, { passive: true });
                row.addEventListener('touchmove', e => {
                    const dx = e.touches[0].clientX - touchStartX;
                    const threshold = 40;
                    if (Math.abs(dx) > threshold) row.classList.add('swiping');
                    else row.classList.remove('swiping');
                }, { passive: true });
                row.addEventListener('touchend', e => {
                    const dx = e.changedTouches[0].clientX - touchStartX;
                    row.classList.remove('swiping');
                    if (Math.abs(dx) > 60) {
                        window.replyTarget = { id: m.id, name: m.name, text: m.text };
                        document.getElementById('replyToName').textContent = m.name || 'مستخدم';
                        document.getElementById('replyTextPreview').textContent = m.text || '[صورة]';
                        replyPreview.classList.add('visible');
                        window.replyTarget = { id: m.id, name: m.name, text: m.text };
                        replyTarget = window.replyTarget;
                        messageInput.focus();
                        showToast('↩ ' + (lang === 'ar' ? 'رد على الرسالة' : 'Replying'), 1800, 'info');
                    }
                }, { passive: true });

                messagesEl.appendChild(row);

                // Translation fetch
                if (m.text && translationMode) {
                    const tgt = lang === 'ar' ? 'en' : 'ar';
                    translateText(m.text, tgt).then(translated => {
                        const el = document.getElementById('tr_' + m.id);
                        if (el) el.textContent = translated;
                    });
                }
            });

            updatePinnedBanner();
            if (searchActive) doSearch();

            if (wasAtBottom) {
                messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
                newMsgCount = 0;
                newMsgBadge.style.display = 'none';
            } else if (!wasAtBottom && list.length > 0) {
                newMsgCount++;
                if (newMsgCount > 0) {
                    newMsgBadge.textContent = newMsgCount;
                    newMsgBadge.style.display = 'flex';
                }
            }
        }

        /* ──────────────────────────────
           SCROLL HANDLING
        ────────────────────────────── */
        messagesEl.addEventListener('scroll', () => {
            const dist = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
            isScrolledUp = dist > 180;
            scrollFab.classList.toggle('visible', isScrolledUp);
            if (!isScrolledUp) { newMsgCount = 0; newMsgBadge.style.display = 'none'; }
        });
        scrollFab.addEventListener('click', () => {
            messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
            newMsgCount = 0; newMsgBadge.style.display = 'none';
        });

        /* ──────────────────────────────
           ACTIONS
        ────────────────────────────── */
        window.openActions = (msgData, msgId, isMine) => {
            selectedMsg = { ...msgData, id: msgId };
            deleteBtn.style.display = isMine ? 'flex' : 'none';
            document.getElementById('modalMsgText').textContent = (msgData.text || '[صورة]').slice(0, 80);
            pinBtn.innerHTML = `<i class="fas fa-thumbtack"></i> ${pinnedMsgId === msgId ? (lang === 'ar' ? 'إلغاء التثبيت' : 'Unpin') : (lang === 'ar' ? 'تثبيت الرسالة' : 'Pin message')}`;
            actionModal.classList.add('open');
        };
        window.closeActions = () => { actionModal.classList.remove('open'); selectedMsg = null; };

        window.addReaction = async (emoji) => {
            if (!selectedMsg) return;
            const docRef = doc(msgsCol, selectedMsg.id);
            const cur = selectedMsg.reactions?.[LOCAL_ID];
            try {
                await updateDoc(docRef, { [`reactions.${LOCAL_ID}`]: cur === emoji ? null : emoji });
                closeActions();
                showToast(cur === emoji ? '💔 أزلت التفاعل' : `${emoji} تفاعلت`, 2000, 'info');
            } catch (e) { console.error(e); }
        };

        window.replyToMessage = () => {
            if (!selectedMsg) return;
            replyTarget = selectedMsg;
            document.getElementById('replyToName').textContent = selectedMsg.name || 'مستخدم';
            document.getElementById('replyTextPreview').textContent = selectedMsg.text || '[صورة]';
            replyPreview.classList.add('visible');
            closeActions();
            messageInput.focus();
        };

        window.copyMessage = () => {
            if (!selectedMsg?.text) { showToast('📋 لا يوجد نص للنسخ', 2200, 'warn'); closeActions(); return; }
            navigator.clipboard?.writeText(selectedMsg.text).then(() => showToast('📋 تم نسخ الرسالة', 2000, 'success'));
            closeActions();
        };

        window.togglePin = async () => {
            if (!selectedMsg) return;
            pinnedMsgId = pinnedMsgId === selectedMsg.id ? null : selectedMsg.id;
            localStorage.setItem('chat_pinned', pinnedMsgId || '');
            updatePinnedBanner();
            showToast(pinnedMsgId ? '📌 تم تثبيت الرسالة' : '📌 تم إلغاء التثبيت', 2200, 'info');
            closeActions();
        };

        window.deleteMessage = async () => {
            if (!selectedMsg) return;
            const msgId = selectedMsg.id;
            if (!confirm(lang === 'ar' ? 'هل أنت متأكد من حذف الرسالة؟' : 'Delete this message?')) return;

            const ref = doc(msgsCol, msgId);

            // Optimistic UI: Hide immediately
            locallyDeletedIds.add(msgId);
            renderMessages(allMessages);
            closeActions();

            try {
                // Try soft-delete first
                await updateDoc(ref, { deleted: true, deletedAt: serverTimestamp() });
                if (pinnedMsgId === msgId) { pinnedMsgId = null; localStorage.removeItem('chat_pinned'); updatePinnedBanner(); }
                showToast('🗑️ تم حذف الرسالة بنجاح', 2200, 'success');
            } catch (updateErr) {
                try {
                    // Fallback to hard delete
                    await deleteDoc(ref);
                    if (pinnedMsgId === msgId) { pinnedMsgId = null; localStorage.removeItem('chat_pinned'); updatePinnedBanner(); }
                    showToast('🗑️ تم الحذف نهائياً', 2200, 'success');
                } catch (deleteErr) {
                    // Revert optimism on failure
                    locallyDeletedIds.delete(msgId);
                    renderMessages(allMessages);

                    console.error('Permission Error:', deleteErr);
                    if (deleteErr.code === 'permission-denied') {
                        showToast('❌ فشل بسبب الصلاحيات! يرجى مراجعة Firestore Rules', 5000, 'error');
                        alert(lang === 'ar' ?
                            'خطأ في Firebase: "Permission Denied".\nيرجى فتح واجهة Firebase Console وتعديل الـ Rules للسماح بالحذف.' :
                            'Firebase Permission Denied.\nPlease check your Firestore Rules to allow deletion.');
                    } else {
                        showToast('❌ فشل الحذف: ' + deleteErr.message, 3500, 'error');
                    }
                }
            }
        };

        window.cancelReply = () => {
            replyTarget = null;
            replyPreview.classList.remove('visible');
        };

        /* ──────────────────────────────
           SCROLL TO MESSAGE
        ────────────────────────────── */
        window.scrollToMessage = (id) => {
            const el = document.getElementById('msg-' + id);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('highlight-msg');
                setTimeout(() => el.classList.remove('highlight-msg'), 1200);
            }
        };

        /* ──────────────────────────────
           LIGHTBOX
        ────────────────────────────── */
        window.openLightbox = (src) => {
            lightboxImg.src = src;
            lightbox.classList.add('open');
        };
        window.closeLightbox = () => lightbox.classList.remove('open');

        /* ──────────────────────────────
           TOAST (color-coded)
        ────────────────────────────── */
        function showToast(msg, duration = 2800, type = '') {
            const el = document.createElement('div');
            el.className = 'toast' + (type ? ' ' + type : '');
            el.textContent = msg;
            document.getElementById('toastWrap').appendChild(el);
            setTimeout(() => { el.classList.add('removing'); setTimeout(() => el.remove(), 320); }, duration);
        }

        /* ──────────────────────────────
           CLOSE MODAL ON OUTSIDE CLICK
        ────────────────────────────── */
        actionModal.addEventListener('click', (e) => {
            if (e.target === actionModal) closeActions();
        });

        /* ──────────────────────────────
           HELPERS
        ────────────────────────────── */
        function escHtml(t) {
            return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function linkify(t) {
            return t.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;word-break:break-all;">$1</a>');
        }
        // Markdown: **bold**, _italic_, `code`
        function markdownFormat(t) {
            return t
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\_(.+?)\_/g, '<em>$1</em>')
                .replace(/`(.+?)`/g, '<code>$1</code>');
        }

        /* ──────────────────────────────
           RESTORE SAVED DATA
        ────────────────────────────── */
        const savedName = localStorage.getItem('chat_name');
        if (savedName) userNameInput.value = savedName;
        updateCharCount();

        /* ──────────────────────────────
           KEYBOARD SHORTCUTS
        ────────────────────────────── */
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
            if (e.key === 'Escape') {
                cancelReply();
                emojiPicker.classList.remove('open');
            }
        });
        // Ctrl+K / Cmd+K → open search
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                if (!searchActive) toggleSearch();
                else closeSearch();
            }
        });

        /* ──────────────────────────────
           SIMULATED ONLINE COUNT (local only)
        ────────────────────────────── */
        function updateOnlineCount() {
            const base = 1 + Math.floor(Math.random() * 4);
            document.getElementById('onlineCount').textContent = base;
        }
        updateOnlineCount();
        setInterval(updateOnlineCount, 30000);

                [[91,28],[98,25],[103,20],[108,18],[113,22]],
                [[108,42],[116,40],[122,38],[128,40],[135,38]],
                [[130,33],[136,35],[140,39],[143,44]]
            ];
            const hubs = [[-74,40],[-3,52],[31,30],[55,25],[77,28],[103,1],[121,31],[151,-34],[-46,-23]];
            let width = 0, height = 0, rotation = 0, huePhase = 0, raf = 0, lastFrame = 0;

            function resize() {
                const rect = canvas.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
                width = rect.width; height = rect.height;
                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function project(lon, lat, cx, cy, radius) {
                const phi = lat * Math.PI / 180;
                const lam = lon * Math.PI / 180 + rotation;
                const cosPhi = Math.cos(phi);
                const z = cosPhi * Math.cos(lam);
                return { x: cx + radius * cosPhi * Math.sin(lam), y: cy - radius * Math.sin(phi), z };
            }

            function strokeGeoLine(points, cx, cy, radius, color, lineWidth, close = false) {
                const full = close ? [...points, points[0]] : points;
                ctx.beginPath();
                let drawing = false;
                for (let i = 0; i < full.length - 1; i++) {
                    const a = full[i], b = full[i + 1];
                    for (let step = 0; step <= 14; step++) {
                        const t = step / 14;
                        const p = project(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, cx, cy, radius);
                        if (p.z > 0.015) {
                            if (!drawing) { ctx.moveTo(p.x, p.y); drawing = true; }
                            else ctx.lineTo(p.x, p.y);
                        } else if (drawing) {
                            drawing = false;
                        }
                    }
                }
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                ctx.stroke();
            }

            function draw(timestamp = 0) {
                if (document.hidden) { raf = 0; return; }
                if (timestamp - lastFrame < 32) { raf = requestAnimationFrame(draw); return; }
                lastFrame = timestamp;
                if (!width || !height) { raf = requestAnimationFrame(draw); return; }
                ctx.clearRect(0, 0, width, height);
                const cx = width / 2, cy = height / 2;
                const radius = Math.min(width, height) * .335;
                const hue = (190 + Math.sin(huePhase) * 35 + 360) % 360;

                // Halo and globe shell
                const halo = ctx.createRadialGradient(cx, cy, radius * .45, cx, cy, radius * 1.55);
                halo.addColorStop(0, `hsla(${hue}, 96%, 54%, .16)`);
                halo.addColorStop(.58, `hsla(${(hue + 28) % 360}, 100%, 52%, .07)`);
                halo.addColorStop(1, 'rgba(0, 10, 55, 0)');
                ctx.fillStyle = halo;
                ctx.beginPath(); ctx.arc(cx, cy, radius * 1.55, 0, Math.PI * 2); ctx.fill();

                const shell = ctx.createRadialGradient(cx - radius * .34, cy - radius * .38, radius * .04, cx, cy, radius * 1.03);
                shell.addColorStop(0, 'rgba(19, 83, 169, .23)');
                shell.addColorStop(.72, 'rgba(3, 20, 78, .2)');
                shell.addColorStop(1, 'rgba(0, 13, 63, .5)');
                ctx.fillStyle = shell;
                ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();

                // Fine outer rings and radar ticks
                ctx.save();
                ctx.strokeStyle = `hsla(${hue}, 95%, 70%, .27)`;
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(cx, cy, radius * 1.07, 0, Math.PI * 2); ctx.stroke();
                ctx.setLineDash([2, 7]);
                ctx.beginPath(); ctx.arc(cx, cy, radius * 1.18, 0, Math.PI * 2); ctx.stroke();
                ctx.setLineDash([]);
                for (let i = 0; i < 72; i++) {
                    const a = i * Math.PI / 36;
                    const inner = radius * (i % 6 === 0 ? 1.1 : 1.14);
                    const outer = radius * 1.18;
                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
                    ctx.lineTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
                    ctx.strokeStyle = `hsla(${(hue + i * 2) % 360}, 95%, 70%, ${i % 6 === 0 ? .48 : .2})`;
                    ctx.stroke();
                }
                ctx.restore();

                // Clip all map lines to the visible hemisphere
                ctx.save();
                ctx.beginPath(); ctx.arc(cx, cy, radius * .995, 0, Math.PI * 2); ctx.clip();
                ctx.strokeStyle = 'rgba(112, 190, 255, .18)';
                ctx.lineWidth = .7;
                for (let latitude = -60; latitude <= 60; latitude += 20) {
                    const line = [];
                    for (let longitude = -180; longitude <= 180; longitude += 6) line.push([longitude, latitude]);
                    strokeGeoLine(line, cx, cy, radius, 'rgba(115, 190, 255, .2)', .65);
                }
                for (let longitude = -160; longitude <= 180; longitude += 20) {
                    const line = [];
                    for (let latitude = -88; latitude <= 88; latitude += 4) line.push([longitude, latitude]);
                    strokeGeoLine(line, cx, cy, radius, 'rgba(115, 190, 255, .19)', .65);
                }

                // Simplified continental outlines and animated country divisions
                land.forEach((continent, index) => {
                    const landHue = (hue + index * 19 + 360) % 360;
                    strokeGeoLine(continent, cx, cy, radius,
                        `hsla(${landHue}, 100%, ${62 + Math.sin(huePhase + index) * 7}%, .8)`, 1.8, true);
                });
                borders.forEach((line, index) => {
                    strokeGeoLine(line, cx, cy, radius,
                        `hsla(${(hue + 18 + index * 4) % 360}, 100%, 72%, .58)`, .8);
                });

                // Pulsing connection hubs
                hubs.forEach((point, index) => {
                    const p = project(point[0], point[1], cx, cy, radius);
                    if (p.z <= 0.04) return;
                    const pulse = .55 + (Math.sin(huePhase * 2.3 + index) + 1) * .45;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 2 + pulse * 2, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${(hue + index * 17) % 360}, 100%, 72%, .9)`; ctx.fill();
                    ctx.beginPath(); ctx.arc(p.x, p.y, 5 + pulse * 5, 0, Math.PI * 2);
                    ctx.strokeStyle = `hsla(${hue}, 100%, 70%, ${.42 * pulse})`; ctx.lineWidth = .8; ctx.stroke();
                });
                ctx.restore();

                // Edge glow and subtle HUD readouts
                ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.strokeStyle = `hsla(${hue}, 100%, 72%, .66)`; ctx.lineWidth = 1.25;
                ctx.shadowColor = `hsl(${hue}, 100%, 65%)`; ctx.shadowBlur = 14; ctx.stroke(); ctx.shadowBlur = 0;
                ctx.fillStyle = `hsla(${hue}, 90%, 84%, .7)`;
                ctx.font = '600 9px ui-monospace, monospace';
                ctx.textAlign = 'left'; ctx.fillText('WORLD MAP / ORBIT', width * .07, height * .16);
                ctx.textAlign = 'right'; ctx.fillText('LAT / LON GRID', width * .93, height * .16);
                ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(153, 210, 255, .54)';
                ctx.fillText(`ROT ${String(Math.round((rotation * 180 / Math.PI + 360) % 360)).padStart(3, '0')}°`, width * .07, height * .86);
                ctx.textAlign = 'right'; ctx.fillText('GEO / VIEW 01', width * .93, height * .86);
                ctx.textAlign = 'center';
                ctx.fillStyle = `hsla(${hue}, 100%, 82%, .68)`;
                ctx.font = '700 8px ui-monospace, monospace';
                ctx.fillText('GLOBAL MAP VIEW', cx, cy + radius * 1.32);

                if (!document.hidden) {
                    if (!reducedMotion.matches) rotation += .0032;
                    huePhase += reducedMotion.matches ? .003 : .012;
                    raf = requestAnimationFrame(draw);
                }
            }

            window.addEventListener('resize', resize, { passive: true });
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
                else if (!raf) raf = requestAnimationFrame(draw);
            });
            resize();
            raf = requestAnimationFrame(draw);
        })();

        /* ──────────────────────────────
           PARTICLE CANVAS
        ────────────────────────────── */
        (function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];
            const N = 55;
            const COLORS = ['59,130,246', '139,92,246', '6,182,212'];

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize); resize();

            for (let i = 0; i < N; i++) particles.push({
                x: Math.random() * 1, y: Math.random() * 1,
                r: .5 + Math.random() * 1.8,
                vx: (Math.random() - .5) * .0003,
                vy: (Math.random() - .5) * .0003,
                alpha: .15 + Math.random() * .5,
                color: COLORS[Math.floor(Math.random() * COLORS.length)]
            });

            function draw() {
                ctx.clearRect(0, 0, W, H);
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0) p.x = 1; if (p.x > 1) p.x = 0;
                    if (p.y < 0) p.y = 1; if (p.y > 1) p.y = 0;
                    ctx.beginPath();
                    ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
                    ctx.fill();
                });
                // Draw connection lines between nearby particles
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = (particles[i].x - particles[j].x) * W;
                        const dy = (particles[i].y - particles[j].y) * H;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x * W, particles[i].y * H);
                            ctx.lineTo(particles[j].x * W, particles[j].y * H);
                            ctx.strokeStyle = `rgba(${particles[i].color},${.07 * (1 - dist / 120)})`;
                            ctx.lineWidth = .6;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

    </script>
</body>
