<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="نقاش عام - غرفة محادثة عامة على موقع حسين عباس" />
    <meta property="og:title" content="نقاش عام | Hussein Abbas" />
    <title>نقاش عام — Hussein Abbas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* ═══════════════════════════════════════════
       ROOT VARIABLES
    ═══════════════════════════════════════════ */
        :root {
            --bg-dark: #03145f;
            --bg-card: #071d68;
            --bg-card-hover: #0d2b82;
            --card-border: rgba(102, 180, 255, 0.16);
            --card-border-hover: rgba(82, 204, 255, 0.34);
            --text-main: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #41a8ff;
            --accent-secondary: #32d9ff;
            --accent-tertiary: #3974ff;
            --accent-glow: rgba(25, 163, 255, 0.48);
            --gradient-warm: linear-gradient(135deg, #1d63ed 0%, #13c8f5 100%);
            --gradient-gold: linear-gradient(135deg, #d9f3ff 0%, #67caff 55%, #43a6ff 100%);
            --gradient-btn: linear-gradient(135deg, #2575f5 0%, #0750dc 100%);
            --header-bg: rgba(2, 17, 72, 0.9);
            --composer-bg: rgba(2, 17, 72, 0.96);
            --font-family: 'IBM Plex Sans Arabic', sans-serif;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            --radius: 16px;
            --mine-color: #1269ec;
            --other-color: #092978;
        }

        body.light {
            --bg-dark: #f0f4ff;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --card-border: rgba(59, 130, 246, 0.12);
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --header-bg: rgba(240, 244, 255, 0.92);
            --composer-bg: rgba(240, 244, 255, 0.98);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --other-color: #f1f5f9;
        }

        /* ═══════════════════════════════════════════
       RESET
    ═══════════════════════════════════════════ */
        * {
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: background .3s, color .3s;
        }

        /* ═══════════════════════════════════════════
       BACKGROUND
    ═══════════════════════════════════════════ */
        .grid-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image:
                linear-gradient(rgba(59, 130, 246, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: grid-drift 80s linear infinite;
        }

        @keyframes grid-drift {
            0% {
                background-position: 0 0
            }

            100% {
                background-position: 60px 60px
            }
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            filter: blur(80px);
            opacity: .08;
        }

        .glow-orb-1 {
            width: 500px;
            height: 500px;
            background: #3b82f6;
            top: -150px;
            right: -150px;
            animation: orb1 12s ease-in-out infinite alternate;
        }

        .glow-orb-2 {
            width: 400px;
            height: 400px;
            background: #8b5cf6;
            bottom: -100px;
            left: -100px;
            animation: orb2 15s ease-in-out infinite alternate;
        }

        @keyframes orb1 {
            from {
                transform: scale(1) translate(0, 0)
            }

            to {
                transform: scale(1.1) translate(30px, 30px)
            }
        }

        @keyframes orb2 {
            from {
                transform: scale(1) translate(0, 0)
            }

            to {
                transform: scale(1.15) translate(-20px, 20px)
            }
        }

        /* ═══════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════ */
        header {
            flex: 0 0 auto;
            height: 68px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: var(--header-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-bottom: 1px solid var(--card-border);
            z-index: 200;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .25);
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            opacity: .3;
        }

        .header-inner {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-start {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-end {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ─── Icon Buttons ─── */
        .icon-btn {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            border-radius: 14px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1.15rem;
            transition: all .3s cubic-bezier(.4, 0, .2, 1);
            text-decoration: none;
            position: relative;
            font-family: inherit;
        }

        .icon-btn i {
            transition: all .3s cubic-bezier(.4, 0, .2, 1);
        }

        .icon-btn:hover {
            color: var(--accent-primary);
            transform: translateY(-3px) scale(1.1);
        }

        .icon-btn:hover i {
            filter: drop-shadow(0 4px 12px rgba(59, 130, 246, .5));
        }

        .icon-btn:active {
            transform: translateY(-1px) scale(1.05);
        }

        .icon-btn[data-active="true"] {
            color: var(--accent-primary);
            background: rgba(59, 130, 246, .12);
            border-radius: 10px;
        }

        /* Tooltip */
        .icon-btn::after {
            content: attr(data-tip);
            position: absolute;
            bottom: -38px;
            left: 50%;
            transform: translateX(-50%) scale(.9);
            background: var(--bg-card);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: .72rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all .25s;
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .3);
            z-index: 1000;
            font-weight: 600;
        }

        .icon-btn:hover::after {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            bottom: -42px;
        }

        /* back button hover red */
        .back-btn:hover {
            color: #ef4444 !important;
        }

        .back-btn:hover i {
            filter: drop-shadow(0 4px 12px rgba(239, 68, 68, .5)) !important;
        }

        /* Brand */
        .brand-info h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -.4px;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #10b981;
            font-size: .72rem;
            font-weight: 700;
            padding: 3px 9px;
            background: rgba(16, 185, 129, .1);
            border-radius: 12px;
            border: 1px solid rgba(16, 185, 129, .2);
            margin-top: 3px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: currentColor;
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: 0 0 8px currentColor;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1)
            }

            50% {
                opacity: .5;
                transform: scale(.85)
            }
        }

        /* Online counter badge */
        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: .72rem;
            font-weight: 700;
            color: var(--accent-secondary);
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(6, 182, 212, .08);
            border: 1px solid rgba(6, 182, 212, .2);
        }

        /* Msg counter */
        .msg-counter {
            background: rgba(59, 130, 246, .08);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: .78rem;
            color: var(--accent-primary);
            border: 1px solid rgba(59, 130, 246, .25);
            font-weight: 700;
            white-space: nowrap;
        }

        /* ═══════════════════════════════════════════
       SEARCH BAR (collapsible)
    ═══════════════════════════════════════════ */
        .search-bar-wrap {
            max-height: 0;
            overflow: hidden;
            transition: max-height .35s cubic-bezier(.4, 0, .2, 1);
            background: var(--header-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid transparent;
        }

        .search-bar-wrap.open {
            max-height: 60px;
            border-bottom-color: var(--card-border);
        }

        .search-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            background: var(--bg-card-hover);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-family: inherit;
            font-size: .9rem;
            padding: 9px 16px;
            border-radius: 22px;
            transition: all .3s;
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .1);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-count {
            font-size: .8rem;
            color: var(--text-muted);
            white-space: nowrap;
            font-weight: 600;
        }

        /* ═══════════════════════════════════════════
       PINNED MESSAGE BANNER
    ═══════════════════════════════════════════ */
        .pinned-banner {
            max-height: 0;
            overflow: hidden;
            transition: max-height .35s ease;
            background: linear-gradient(135deg, rgba(59, 130, 246, .06), rgba(6, 182, 212, .04));
            border-bottom: 1px solid transparent;
            cursor: pointer;
        }

        .pinned-banner.visible {
            max-height: 60px;
            border-bottom-color: rgba(59, 130, 246, .15);
        }

        .pinned-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .85rem;
            color: var(--text-secondary);
        }

        .pinned-inner i {
            color: var(--accent-primary);
            font-size: .85rem;
        }

        .pinned-text {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .pinned-text strong {
            color: var(--accent-primary);
            margin-left: 4px;
        }

        /* ═══════════════════════════════════════════
       MESSAGES AREA
    ═══════════════════════════════════════════ */
        .main-wrap {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #messagesArea {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 20px 28px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scroll-behavior: smooth;
        }

        #messagesArea::-webkit-scrollbar {
            width: 5px;
        }

        #messagesArea::-webkit-scrollbar-track {
            background: transparent;
        }

        #messagesArea::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 4px;
        }

        /* ─── Date Divider ─── */
        .date-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 14px 0 10px;
            font-size: .72rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .date-divider::before,
        .date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--card-border), transparent);
        }

        /* ─── Message Row ─── */
        .msg {
            display: flex;
            flex-direction: column;
            max-width: 78%;
            margin: 2px 0;
            animation: msg-pop .3s cubic-bezier(.34, 1.56, .64, 1);
            position: relative;
        }

        @keyframes msg-pop {
            from {
                opacity: 0;
                transform: scale(.92) translateY(8px)
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0)
            }
        }

        /* RTL mine = right, other = left */
        html[lang="ar"] #messagesArea {
            direction: rtl;
        }

        html[lang="ar"] .msg.mine {
            align-self: flex-end;
            align-items: flex-end;
        }

        html[lang="ar"] .msg.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        html[lang="en"] #messagesArea {
            direction: ltr;
        }

        html[lang="en"] .msg.mine {
            align-self: flex-end;
            align-items: flex-end;
        }

        html[lang="en"] .msg.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        /* consecutive messages - collapse gap */
        .msg.consecutive {
            margin-top: 1px;
        }

        .msg.consecutive .sender-name {
            display: none;
        }

        /* ─── Avatar ─── */
        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .msg.mine .msg-row {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: .75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-bottom: 2px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
            transition: transform .2s;
        }

        .avatar:hover {
            transform: scale(1.15);
        }

        .msg.consecutive .avatar {
            visibility: hidden;
        }

        /* ─── Sender name ─── */
        .sender-name {
            font-size: .72rem;
            color: var(--accent-primary);
            margin-bottom: 4px;
            padding: 0 4px;
            font-weight: 700;
        }

        /* ─── Bubble ─── */
        .bubble {
            padding: 12px 18px;
            border-radius: 20px;
            font-size: .95rem;
            line-height: 1.65;
            word-wrap: break-word;
            word-break: break-word;
            cursor: pointer;
            user-select: none;
            position: relative;
            overflow: hidden;
            transition: all .25s cubic-bezier(.4, 0, .2, 1);
            max-width: 100%;
        }

        .bubble:active {
            transform: scale(.98);
        }

        /* Mine bubble */
        .msg.mine .bubble {
            background: linear-gradient(135deg, rgba(59, 130, 246, .18), rgba(59, 130, 246, .28));
            color: var(--text-main);
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .3) inset, 0 6px 24px rgba(59, 130, 246, .18);
        }

        html[lang="ar"] .msg.mine .bubble {
            border-bottom-left-radius: 5px;
        }

        html[lang="en"] .msg.mine .bubble {
            border-bottom-right-radius: 5px;
        }

        .msg.mine .bubble::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .08), transparent);
            transform: translateX(-100%);
            transition: transform .6s;
        }

        .msg.mine .bubble:hover::before {
            transform: translateX(100%);
        }

        .msg.mine .bubble:hover {
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .45) inset, 0 8px 32px rgba(59, 130, 246, .25);
            transform: translateY(-1px);
        }

        /* Other bubble */
        .msg.other .bubble {
            background: linear-gradient(135deg, rgba(15, 23, 42, .45), rgba(30, 41, 59, .7));
            color: var(--text-main);
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .12) inset, 0 4px 20px rgba(0, 0, 0, .25);
        }

        html[lang="ar"] .msg.other .bubble {
            border-bottom-right-radius: 5px;
        }

        html[lang="en"] .msg.other .bubble {
            border-bottom-left-radius: 5px;
        }

        .msg.other .bubble:hover {
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .2) inset, 0 6px 24px rgba(0, 0, 0, .3);
            transform: translateY(-1px);
        }

        body.light .msg.mine .bubble {
            background: linear-gradient(135deg, rgba(59, 130, 246, .12), rgba(59, 130, 246, .2));
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .2) inset, 0 4px 16px rgba(59, 130, 246, .1);
        }

        body.light .msg.other .bubble {
            background: linear-gradient(135deg, #fff, #f8fafc);
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .08) inset, 0 4px 16px rgba(0, 0, 0, .07);
            color: #0f172a;
        }

        /* ─── Highlight ─── */
        .msg.highlight-msg .bubble {
            animation: highlight-flash .6s ease-out;
        }

        @keyframes highlight-flash {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
            }

            40% {
                box-shadow: 0 0 0 8px rgba(59, 130, 246, .25);
            }
        }

        /* ─── Media in bubble ─── */
        .msg-img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            margin: 6px 0;
            cursor: pointer;
            transition: transform .2s, opacity .2s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .3);
        }

        .msg-img:hover {
            transform: scale(1.02);
            opacity: .95;
        }

        /* Image lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .9);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            backdrop-filter: blur(8px);
            animation: fade-in .2s;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 88vh;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
        }

        @keyframes fade-in {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        /* ─── Time & Status ─── */
        .msg-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
            margin-top: 6px;
        }

        .msg.other .msg-footer {
            justify-content: flex-start;
        }

        .msg-time {
            font-size: .62rem;
            opacity: .65;
            color: var(--text-muted);
        }

        .msg.mine .msg-time {
            color: rgba(148, 163, 184, .8);
        }

        .msg-status {
            font-size: .62rem;
            color: var(--accent-secondary);
        }

        /* ─── Reply Context ─── */
        .reply-context {
            font-size: .78rem;
            margin-bottom: 8px;
            padding: 8px 12px;
            background: rgba(59, 130, 246, .1);
            border-inline-start: 3px solid var(--accent-primary);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background .2s;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .reply-context:hover {
            background: rgba(59, 130, 246, .18);
        }

        .msg.mine .reply-context {
            background: rgba(255, 255, 255, .08);
        }

        .msg.mine .reply-context:hover {
            background: rgba(255, 255, 255, .13);
        }

        /* ─── Reactions ─── */
        .reactions-bar {
            position: absolute;
            bottom: -14px;
            display: flex;
            gap: 3px;
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            padding: 3px 8px;
            border-radius: 16px;
            font-size: .82rem;
            z-index: 5;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
            cursor: pointer;
            transition: transform .2s;
        }

        .reactions-bar:hover {
            transform: scale(1.08);
        }

        html[lang="ar"] .msg.mine .reactions-bar {
            left: 8px;
        }

        html[lang="ar"] .msg.other .reactions-bar {
            right: 8px;
        }

        html[lang="en"] .msg.mine .reactions-bar {
            right: 8px;
        }

        html[lang="en"] .msg.other .reactions-bar {
            left: 8px;
        }

        /* ─── Translation ─── */
        .translation-wrap {
            border-top: 1px solid rgba(59, 130, 246, .15);
            margin-top: 8px;
            padding-top: 8px;
        }

        .translation-label {
            font-size: .62rem;
            color: var(--accent-primary);
            font-style: italic;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .msg-translation {
            font-size: .85rem;
            opacity: .85;
        }

        .msg.other .msg-translation {
            color: var(--text-secondary);
        }

        /* ─── Typing Indicator ─── */
        .typing-wrap {
            padding: 0 20px 8px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            min-height: 24px;
            display: flex;
            align-items: center;
            transition: opacity .3s;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: .78rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-secondary);
            animation: typing-bounce .9s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes typing-bounce {

            0%,
            80%,
            100% {
                transform: scale(.7);
                opacity: .4
            }

            40% {
                transform: scale(1.1);
                opacity: 1
            }
        }

        /* ═══════════════════════════════════════════
       COMPOSER
    ═══════════════════════════════════════════ */
        .composer-wrap {
            flex: 0 0 auto;
            background: linear-gradient(180deg, transparent, var(--composer-bg));
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(59, 130, 246, .08);
            z-index: 150;
            position: relative;
        }

        .composer-wrap::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, .3), transparent);
        }

        .composer-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 12px 16px 16px;
        }

        /* Reply preview bar */
        .reply-preview-bar {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            margin-bottom: 8px;
            background: var(--bg-card);
            border-radius: 12px;
            border-inline-start: 3px solid var(--accent-primary);
            font-size: .82rem;
            color: var(--text-secondary);
            animation: slide-down .2s ease-out;
        }

        .reply-preview-bar.visible {
            display: flex;
        }

        @keyframes slide-down {
            from {
                opacity: 0;
                transform: translateY(-8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .reply-preview-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .reply-preview-info strong {
            color: var(--accent-primary);
            font-size: .75rem;
        }

        .reply-cancel {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(239, 68, 68, .1);
            border: none;
            color: #ef4444;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .8rem;
            transition: all .2s;
        }

        .reply-cancel:hover {
            background: rgba(239, 68, 68, .2);
            transform: scale(1.1);
        }

        /* Image preview */
        .img-preview-bar {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            margin-bottom: 8px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid rgba(139, 92, 246, .25);
        }

        .img-preview-bar.visible {
            display: flex;
        }

        .img-thumb {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
        }

        .img-preview-name {
            flex: 1;
            font-size: .8rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .img-remove {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(239, 68, 68, .1);
            border: none;
            color: #ef4444;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .78rem;
            transition: all .2s;
        }

        .img-remove:hover {
            background: rgba(239, 68, 68, .2);
            transform: scale(1.1);
        }

        /* Input bar */
        .input-bar {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: linear-gradient(135deg, rgba(15, 23, 42, .4), rgba(15, 23, 42, .6));
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 10px 14px;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .18) inset, 0 10px 36px rgba(0, 0, 0, .3);
            transition: all .35s cubic-bezier(.4, 0, .2, 1);
            position: relative;
            overflow: hidden;
        }

        .input-bar::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(59, 130, 246, .4), rgba(139, 92, 246, .4), rgba(6, 182, 212, .4));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity .4s;
            pointer-events: none;
        }

        .input-bar:focus-within {
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .35) inset, 0 0 36px rgba(59, 130, 246, .2), 0 10px 36px rgba(0, 0, 0, .4);
            transform: translateY(-2px);
        }

        .input-bar:focus-within::before {
            opacity: 1;
        }

        body.light .input-bar {
            background: linear-gradient(135deg, rgba(255, 255, 255, .8), rgba(255, 255, 255, .95));
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .12) inset, 0 8px 28px rgba(0, 0, 0, .08);
        }

        /* Name input */
        #userName {
            background: linear-gradient(135deg, rgba(59, 130, 246, .12), rgba(59, 130, 246, .2));
            border: none;
            color: var(--accent-primary);
            font-size: .85rem;
            font-weight: 700;
            padding: 10px 12px;
            border-radius: 16px;
            width: 80px;
            text-align: center;
            font-family: inherit;
            transition: all .3s;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .25) inset;
            cursor: pointer;
            flex-shrink: 0;
        }

        #userName:focus {
            background: rgba(59, 130, 246, .25);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, .4) inset, 0 0 16px rgba(59, 130, 246, .2);
            transform: scale(1.04);
        }

        /* Emoji button */
        .emoji-trigger {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all .25s;
            flex-shrink: 0;
        }

        .emoji-trigger:hover {
            transform: scale(1.2) rotate(-10deg);
        }

        /* Message textarea */
        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: .96rem;
            font-family: inherit;
            resize: none;
            max-height: 110px;
            min-height: 26px;
            padding: 10px 0;
            line-height: 1.55;
        }

        #messageInput::placeholder {
            color: var(--text-muted);
            opacity: .6;
        }

        #messageInput:focus::placeholder {
            opacity: .35;
        }

        html[lang="ar"] #messageInput {
            text-align: right;
        }

        html[lang="en"] #messageInput {
            text-align: left;
        }

        /* Char counter */
        .char-count {
            font-size: .65rem;
            color: var(--text-muted);
            align-self: flex-end;
            padding-bottom: 12px;
            transition: color .2s;
            flex-shrink: 0;
        }

        .char-count.warn {
            color: var(--accent-secondary);
        }

        .char-count.limit {
            color: #ef4444;
            font-weight: 700;
        }

        /* Attach button */
        .attach-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(139, 92, 246, .12);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all .3s;
            box-shadow: 0 0 0 1px rgba(139, 92, 246, .25) inset;
            flex-shrink: 0;
        }

        .attach-btn:hover {
            color: #8b5cf6;
            background: rgba(139, 92, 246, .22);
            transform: scale(1.1) rotate(12deg);
            box-shadow: 0 0 0 1px rgba(139, 92, 246, .45) inset, 0 6px 20px rgba(139, 92, 246, .35);
        }

        .attach-btn.has-file {
            color: #8b5cf6;
            background: rgba(139, 92, 246, .28);
            animation: pulse-attach 2s infinite;
        }

        @keyframes pulse-attach {

            0%,
            100% {
                box-shadow: 0 0 0 1px rgba(139, 92, 246, .5) inset, 0 0 18px rgba(139, 92, 246, .3);
            }

            50% {
                box-shadow: 0 0 0 1px rgba(139, 92, 246, .7) inset, 0 0 30px rgba(139, 92, 246, .5);
            }
        }

        /* Send button */
        .send-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #2563eb, #1d4ed8);
            color: #fff;
            cursor: pointer;
            display: grid;
            place-items: center;
            font-size: 1rem;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .5) inset, 0 6px 20px rgba(59, 130, 246, .45), 0 0 30px rgba(59, 130, 246, .25);
            transition: all .3s cubic-bezier(.4, 0, .2, 1);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .send-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, .25), transparent);
            opacity: 0;
            transition: opacity .3s;
        }

        .send-btn:hover {
            transform: scale(1.12) rotate(-12deg);
            box-shadow: 0 0 0 1px rgba(59, 130, 246, .7) inset, 0 10px 28px rgba(59, 130, 246, .55), 0 0 50px rgba(59, 130, 246, .4);
        }

        .send-btn:hover::before {
            opacity: 1;
        }

        .send-btn:active {
            transform: scale(1.05) rotate(-12deg);
        }

        .send-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .send-btn i {
            transition: transform .3s;
        }

        .send-btn:hover i {
            transform: translateX(-3px);
        }

        /* ═══════════════════════════════════════════
       EMOJI PICKER POPUP
    ═══════════════════════════════════════════ */
        .emoji-picker-popup {
            position: absolute;
            bottom: 90px;
            left: 20px;
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, .4);
            z-index: 300;
            width: 300px;
            display: none;
            animation: picker-in .25s cubic-bezier(.34, 1.56, .64, 1);
        }

        .emoji-picker-popup.open {
            display: block;
        }

        @keyframes picker-in {
            from {
                opacity: 0;
                transform: scale(.85) translateY(10px)
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0)
            }
        }

        .emoji-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .emoji-tab-btn {
            flex: 1;
            padding: 6px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all .2s;
            color: var(--text-muted);
        }

        .emoji-tab-btn.active,
        .emoji-tab-btn:hover {
            background: rgba(59, 130, 246, .1);
            color: var(--text-main);
            transform: scale(1.1);
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
            max-height: 180px;
            overflow-y: auto;
        }

        .emoji-grid::-webkit-scrollbar {
            width: 3px;
        }

        .emoji-grid::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 2px;
        }

        .emoji-cell {
            font-size: 1.3rem;
            cursor: pointer;
            border-radius: 8px;
            padding: 4px;
            text-align: center;
            transition: all .15s;
            border: none;
            background: transparent;
        }

        .emoji-cell:hover {
            background: rgba(59, 130, 246, .12);
            transform: scale(1.25);
        }

        /* ═══════════════════════════════════════════
       FAB – Scroll to bottom
    ═══════════════════════════════════════════ */
        .fab-scroll {
            position: fixed;
            bottom: 100px;
            left: 24px;
            width: 44px;
            height: 44px;
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 120;
            opacity: 0;
            transform: translateY(16px) scale(.9);
            pointer-events: none;
            transition: all .3s cubic-bezier(.4, 0, .2, 1);
            box-shadow: var(--shadow-lg);
            font-size: .9rem;
        }

        .fab-scroll.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .fab-scroll:hover {
            color: var(--accent-primary);
            border-color: var(--accent-primary);
            transform: translateY(-3px) scale(1.05);
        }

        .fab-new-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ef4444;
            color: #fff;
            font-size: .6rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ═══════════════════════════════════════════
       ACTION MODAL
    ═══════════════════════════════════════════ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            z-index: 400;
            display: none;
            align-items: flex-end;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.open {
            display: flex;
            animation: fade-in .2s;
        }

        .room-modal-overlay {
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .room-modal-card {
            width: min(100%, 440px);
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
        }

        .room-modal-card h2 { margin: 0 0 8px; font-size: 1.15rem; }
        .room-modal-card p { margin: 0 0 16px; color: var(--text-secondary); font-size: .88rem; line-height: 1.6; }
        .room-modal-card input { width: 100%; min-height: 46px; border: 1px solid var(--card-border); border-radius: 12px; background: var(--bg-card-hover); color: var(--text-main); padding: 10px 12px; font: inherit; }
        .room-modal-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
        .room-modal-actions button { flex: 1; min-height: 42px; border: 1px solid var(--card-border); border-radius: 12px; background: var(--bg-card-hover); color: var(--text-main); font: inherit; font-weight: 700; cursor: pointer; }
        .room-modal-actions .room-primary { background: var(--accent-primary); color: #fff; border-color: transparent; }
        .room-code-result { display: none; margin-top: 16px; padding: 14px; border-radius: 14px; border: 1px dashed var(--accent-primary); text-align: center; }
        .room-code-result.visible { display: block; }
        .room-code-value { display: block; margin: 8px 0; font: 800 1.2rem/1.5 ui-monospace, monospace; letter-spacing: .08em; overflow-wrap: anywhere; }

        .action-menu {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 8px 0 20px;
            box-shadow: 0 -16px 48px rgba(0, 0, 0, .5);
            animation: sheet-up .3s cubic-bezier(.34, 1.56, .64, 1);
        }

        @keyframes sheet-up {
            from {
                transform: translateY(60%)
            }

            to {
                transform: translateY(0)
            }
        }

        .sheet-handle {
            width: 44px;
            height: 4px;
            border-radius: 2px;
            background: var(--card-border);
            margin: 12px auto 14px;
        }

        /* Message preview in modal */
        .modal-msg-preview {
            margin: 0 16px 14px;
            padding: 10px 14px;
            background: var(--bg-card-hover);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            font-size: .82rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-msg-preview i {
            color: var(--accent-primary);
        }

        /* Reaction row */
        .emoji-bar {
            display: flex;
            gap: 4px;
            padding: 4px 16px 14px;
            border-bottom: 1px solid var(--card-border);
            overflow-x: auto;
        }

        .emoji-bar::-webkit-scrollbar {
            display: none;
        }

        .emoji-btn {
            background: rgba(59, 130, 246, .07);
            border: 1px solid transparent;
            border-radius: 12px;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 7px 10px;
            transition: all .2s;
            white-space: nowrap;
        }

        .emoji-btn:hover {
            transform: scale(1.3);
            background: rgba(59, 130, 246, .15);
            border-color: rgba(59, 130, 246, .3);
        }

        .emoji-btn.reacted {
            background: rgba(59, 130, 246, .2);
            border-color: var(--accent-primary);
        }

        /* Menu items */
        .menu-actions {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 13px 16px;
            border-radius: 14px;
            cursor: pointer;
            text-align: start;
            font-family: inherit;
            font-size: .94rem;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: background .2s;
            font-weight: 500;
        }

        .menu-btn:hover {
            background: rgba(59, 130, 246, .08);
        }

        .menu-btn i {
            width: 20px;
            text-align: center;
            color: var(--accent-primary);
            font-size: .95rem;
        }

        .menu-btn.danger {
            color: #ef4444;
        }

        .menu-btn.danger:hover {
            background: rgba(239, 68, 68, .08);
        }

        .menu-btn.danger i {
            color: #ef4444;
        }

        .menu-sep {
            height: 1px;
            background: var(--card-border);
            margin: 4px 16px;
        }

        /* ═══════════════════════════════════════════
       IMAGE LIGHTBOX
    ═══════════════════════════════════════════ */
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
            border: none;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, .2);
            transform: scale(1.1);
        }

        /* ═══════════════════════════════════════════
       TOAST NOTIFICATIONS
    ═══════════════════════════════════════════ */
        .toast-wrap {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            padding: 10px 20px;
            border-radius: 24px;
            font-size: .83rem;
            font-weight: 600;
            color: var(--text-main);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
            animation: toast-in .35s cubic-bezier(.34, 1.56, .64, 1);
            white-space: nowrap;
            max-width: 90vw;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.removing {
            animation: toast-out .3s ease-out forwards;
        }

        @keyframes toast-in {
            from {
                opacity: 0;
                transform: scale(.8) translateY(-8px)
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0)
            }
        }

        @keyframes toast-out {
            from {
                opacity: 1;
                transform: scale(1)
            }

            to {
                opacity: 0;
                transform: scale(.8) translateY(-8px)
            }
        }

        /* ═══════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════ */
        @media(max-width:768px) {
            .msg {
                max-width: 88%;
            }

            header {
                padding: 0 14px;
            }

            .brand-info h1 {
                font-size: 1.05rem;
            }

            .icon-btn {
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }

            .msg-counter {
                padding: 6px 11px;
                font-size: .72rem;
            }

            .composer-inner {
                padding: 10px 12px 14px;
            }

            #userName {
                width: 68px;
                font-size: .8rem;
            }

            .emoji-picker-popup {
                left: 10px;
                right: 10px;
                width: auto;
            }

            .online-badge {
                display: none;
            }
        }

        @media(max-width:400px) {
            .msg {
                max-width: 93%;
            }

            .msg-counter,
            .online-badge {
                display: none;
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }

        /* ═══════════════════════════════════════════
           PARTICLES CANVAS
        ═══════════════════════════════════════════ */
        /* Refined public room presentation */
        body { background-image: radial-gradient(ellipse at 50% -25%, rgba(59,130,246,.16), transparent 58%); }
        header { padding: 0 22px; background: linear-gradient(180deg, rgba(3,7,18,.94), rgba(3,7,18,.78)); }
        .header-inner { min-height: 76px; max-width: 960px; }
        .header-start { gap: 12px; }
        .back-btn { border: 1px solid var(--card-border); background: rgba(255,255,255,.035); }
        .brand-info h1 { font-size: 1.1rem; }
        .status-badge { transition: background .2s, color .2s; }
        .status-badge.is-offline { color: #fbbf24; background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.24); }
        .header-end { gap: 7px; }
        .main-wrap { max-width: 960px; }
        #messagesArea { padding: 24px clamp(14px, 3.5vw, 36px) 30px; gap: 6px; }
        .composer-wrap { background: linear-gradient(180deg, rgba(3,7,18,.82), var(--composer-bg)); }
        .composer-inner { max-width: 960px; padding: 14px 22px calc(12px + env(safe-area-inset-bottom)); }
        .input-bar { gap: 9px; background: rgba(15,23,42,.76); border-radius: 22px; padding: 9px 12px; }
        body.light .input-bar { background: rgba(255,255,255,.93); }
        #messageInput { min-height: 42px; }
        #userName { width: 96px; }
        .composer-hints { display: flex; align-items: center; gap: 14px; padding: 9px 6px 0; color: var(--text-muted); font-size: .68rem; }
        .composer-hints > span { display: inline-flex; align-items: center; gap: 4px; }
        .composer-hints kbd { padding: 2px 5px; border: 1px solid var(--card-border); border-radius: 5px; background: var(--bg-card); color: var(--text-secondary); font: inherit; font-size: .64rem; font-weight: 600; }
        .composer-hints .composer-private { margin-inline-start: auto; }
        .composer-private i { color: #34d399; }
        @media(max-width:768px) { header { padding: 0 12px; } .header-inner { min-height: 68px; } .composer-inner { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); } .composer-hints { gap: 8px; font-size: .63rem; } }
        @media(max-width:520px) { .header-end { gap: 1px; } .header-end .icon-btn { width: 34px; height: 36px; font-size: .9rem; } .brand-info h1 { font-size: .98rem; } .composer-hints { justify-content: space-between; gap: 5px; } .composer-hints .composer-private { display: none; } #userName { width: 62px; padding-inline: 5px; } }

        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: .45;
        }

        #worldGlobeCanvas {
            position: fixed;
            z-index: 0;
            width: min(76vw, 660px);
            height: min(76vw, 660px);
            left: 50%;
            top: 49%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: .38;
            mix-blend-mode: screen;
        }

        /* ═══════════════════════════════════════════
           THIRD GLOW ORB
        ═══════════════════════════════════════════ */
        .glow-orb-3 {
            width: 350px;
            height: 350px;
            background: #06b6d4;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            animation: orb3 18s ease-in-out infinite alternate;
        }

        @keyframes orb3 {
            from {
                transform: translateX(-60%) scale(1);
            }

            to {
                transform: translateX(-40%) scale(1.12);
            }
        }

        /* ═══════════════════════════════════════════
           SOUND BUTTON
        ═══════════════════════════════════════════ */
        .icon-btn.muted {
            color: #ef4444 !important;
        }

        .icon-btn.muted i {
            filter: drop-shadow(0 4px 12px rgba(239, 68, 68, .5)) !important;
        }

        /* ═══════════════════════════════════════════
           MARKDOWN IN BUBBLES
        ═══════════════════════════════════════════ */
        .bubble-text strong {
            font-weight: 800;
        }

        .bubble-text em {
            font-style: italic;
            opacity: .9;
        }

        .bubble-text code {
            font-family: 'Courier New', monospace;
            background: rgba(59, 130, 246, .18);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: .85em;
        }

        /* ═══════════════════════════════════════════
           COLOR-CODED TOASTS
        ═══════════════════════════════════════════ */
        .toast.success {
            border-color: rgba(16, 185, 129, .4);
            background: linear-gradient(135deg, rgba(16, 185, 129, .12), var(--bg-card));
        }

        .toast.error {
            border-color: rgba(239, 68, 68, .4);
            background: linear-gradient(135deg, rgba(239, 68, 68, .12), var(--bg-card));
        }

        .toast.info {
            border-color: rgba(59, 130, 246, .4);
            background: linear-gradient(135deg, rgba(59, 130, 246, .12), var(--bg-card));
        }

        .toast.warn {
            border-color: rgba(245, 158, 11, .4);
            background: linear-gradient(135deg, rgba(245, 158, 11, .12), var(--bg-card));
        }

        /* ═══════════════════════════════════════════
           EMPTY STATE
        ═══════════════════════════════════════════ */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 40px 20px;
            text-align: center;
            animation: fade-in .6s ease;
        }

        .empty-icon {
            font-size: 4rem;
            animation: float-icon 3s ease-in-out infinite;
            filter: drop-shadow(0 8px 24px rgba(59, 130, 246, .4));
        }

        @keyframes float-icon {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .empty-title {
            font-size: 1.3rem;
            font-weight: 800;
            background: var(--gradient-warm);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .empty-sub {
            font-size: .9rem;
            color: var(--text-muted);
            max-width: 260px;
            line-height: 1.7;
        }

        .empty-arrow {
            font-size: 2rem;
            color: var(--accent-primary);
            opacity: .6;
            animation: bounce-down 1.5s ease-in-out infinite;
        }

        @keyframes bounce-down {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(8px);
            }
        }

        /* ═══════════════════════════════════════════
           SKELETON LOADING
        ═══════════════════════════════════════════ */
        .skeleton-wrap {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            width: 100%;
        }

        .skeleton-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .skeleton-row.right {
            flex-direction: row-reverse;
        }

        .skeleton-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--bg-card-hover);
            flex-shrink: 0;
            animation: shimmer 1.6s infinite;
        }

        .skeleton-bubble {
            height: 48px;
            border-radius: 18px;
            background: var(--bg-card-hover);
            animation: shimmer 1.6s infinite;
        }

        @keyframes shimmer {
            0% {
                opacity: .4;
            }

            50% {
                opacity: .8;
            }

            100% {
                opacity: .4;
            }
        }

        /* ═══════════════════════════════════════════
           EMOJI PICKER SEARCH
        ═══════════════════════════════════════════ */
        .emoji-search {
            width: 100%;
            background: var(--bg-card-hover);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-family: inherit;
            font-size: .85rem;
            padding: 7px 12px;
            border-radius: 14px;
            margin-bottom: 10px;
            transition: all .3s;
        }

        .emoji-search:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .12);
        }

        .emoji-search::placeholder {
            color: var(--text-muted);
        }

        /* ═══════════════════════════════════════════
           REACTION POP ANIMATION
        ═══════════════════════════════════════════ */
        .reactions-bar span {
            display: inline-block;
            animation: react-pop .35s cubic-bezier(.34, 1.56, .64, 1);
        }

        @keyframes react-pop {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ═══════════════════════════════════════════
           SWIPE REPLY INDICATOR
        ═══════════════════════════════════════════ */
        .swipe-reply-hint {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-primary);
            font-size: .9rem;
            opacity: 0;
            transition: opacity .2s;
            pointer-events: none;
        }

        html[lang="ar"] .msg.mine .swipe-reply-hint {
            left: -28px;
        }

        html[lang="ar"] .msg.other .swipe-reply-hint {
            right: -28px;
        }

        html[lang="en"] .msg.mine .swipe-reply-hint {
            right: -28px;
        }

        html[lang="en"] .msg.other .swipe-reply-hint {
            left: -28px;
        }

        .msg.swiping .swipe-reply-hint {
            opacity: 1;
        }

        /* ═══════════════════════════════════════════
           ENHANCED SCROLL FAB
        ═══════════════════════════════════════════ */
        .fab-scroll {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-card-hover)) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .35), 0 0 0 1px var(--card-border) !important;
        }

        .fab-scroll:hover {
            background: linear-gradient(135deg, rgba(59, 130, 246, .15), rgba(59, 130, 246, .08)) !important;
            box-shadow: 0 12px 40px rgba(59, 130, 246, .25), 0 0 0 1px rgba(59, 130, 246, .35) !important;
        }

        /* Royal-blue luminous chat theme inspired by the supplied reference */
        body:not(.light) {
            background: radial-gradient(ellipse at 50% 42%, #0b36a5 0%, #082a83 42%, #03145f 100%);
        }
        body.light {
            background: radial-gradient(ellipse at 50% 42%, #e8f6ff 0%, #f0f5ff 52%, #e5edff 100%);
        }
        .grid-bg {
            background-image:
                radial-gradient(ellipse at 50% 42%, transparent 0%, rgba(1, 13, 65, .18) 72%),
                linear-gradient(rgba(126, 204, 255, .018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(126, 204, 255, .018) 1px, transparent 1px);
            background-size: auto, 64px 64px, 64px 64px;
        }
        .glow-orb { opacity: .15; filter: blur(100px); }
        .glow-orb-1 { background: #087cff; }
        .glow-orb-2 { background: #123fff; }
        .glow-orb-3 { background: #00d9ff; opacity: .1; }
        .blue-ribbon {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            width: min(900px, 92vw);
            height: min(390px, 44vh);
            min-height: 240px;
            top: 34%;
            left: 50%;
            transform: translateX(-50%);
            opacity: .27;
        }
        .blue-ribbon svg { width: 100%; height: 100%; overflow: visible; }
        .blue-ribbon .ribbon-glow { fill: none; stroke: #057dff; stroke-width: 24; stroke-linecap: round; opacity: .56; filter: url(#ribbonBlur); }
        .blue-ribbon .ribbon-line { fill: none; stroke: url(#ribbonGradient); stroke-width: 7; stroke-linecap: round; filter: url(#ribbonGlow); }
        header { background: linear-gradient(180deg, rgba(2, 17, 72, .96), rgba(3, 24, 91, .8)); border-bottom-color: rgba(91, 187, 255, .18); }
        .composer-wrap { background: linear-gradient(180deg, rgba(3, 29, 101, .78), var(--composer-bg)); border-top-color: rgba(65, 168, 255, .2); }
        .input-bar { background: linear-gradient(135deg, rgba(5, 31, 104, .88), rgba(8, 42, 127, .91)); box-shadow: 0 0 0 1px rgba(77, 173, 255, .24) inset, 0 12px 38px rgba(0, 9, 48, .34); }
        .input-bar::before { background: linear-gradient(135deg, rgba(54, 142, 255, .52), rgba(0, 220, 255, .4), rgba(55, 105, 255, .48)); }
        .input-bar:focus-within { box-shadow: 0 0 0 1px rgba(70, 194, 255, .52) inset, 0 0 34px rgba(0, 167, 255, .22), 0 12px 38px rgba(0, 9, 48, .4); }
        .msg.mine .bubble { background: linear-gradient(135deg, rgba(23, 105, 237, .82), rgba(11, 78, 193, .9)); box-shadow: 0 0 0 1px rgba(114, 199, 255, .28) inset, 0 8px 28px rgba(0, 20, 92, .26); }
        .msg.other .bubble { background: linear-gradient(135deg, rgba(7, 32, 104, .86), rgba(9, 42, 125, .9)); box-shadow: 0 0 0 1px rgba(106, 184, 255, .16) inset, 0 6px 24px rgba(0, 12, 63, .24); }
        .icon-btn:hover { color: #5ce3ff; }
        .room-modal-card { background: rgba(5, 24, 87, .97); border-color: rgba(91, 187, 255, .24); }
        .room-modal-card input, .room-modal-actions button { background-color: rgba(12, 42, 120, .82); }
        .main-wrap { position: relative; z-index: 1; }
        body.light .blue-ribbon { opacity: .12; }
        .blue-ribbon { opacity: .08; }
        body.light #worldGlobeCanvas { opacity: .16; mix-blend-mode: multiply; }
        @media(max-width: 700px) {
            #worldGlobeCanvas { width: 96vw; height: 96vw; top: 50%; opacity: .24; }
            .blue-ribbon { display: none; }
        }
        @media(prefers-reduced-motion: reduce) {
            #worldGlobeCanvas { opacity: .18; }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <canvas id="particleCanvas"></canvas>
    <canvas id="worldGlobeCanvas" aria-hidden="true"></canvas>
    <div class="grid-bg"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>
    <div class="blue-ribbon" aria-hidden="true">
        <svg viewBox="0 0 900 390" role="presentation">
            <defs>
                <linearGradient id="ribbonGradient" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#00dcff" />
                    <stop offset=".46" stop-color="#197dff" />
                    <stop offset="1" stop-color="#51e6ff" />
                </linearGradient>
                <filter id="ribbonBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="15" /></filter>
                <filter id="ribbonGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
            </defs>
            <path class="ribbon-glow" d="M95 285 C 50 195, 65 95, 160 64 C 245 36, 313 82, 341 154 C 369 226, 442 277, 531 238 C 605 205, 621 130, 704 147 C 780 163, 815 238, 776 307" />
            <path class="ribbon-line" d="M95 285 C 50 195, 65 95, 160 64 C 245 36, 313 82, 341 154 C 369 226, 442 277, 531 238 C 605 205, 621 130, 704 147 C 780 163, 815 238, 776 307" />
        </svg>
    </div>

    <!-- ═══ HEADER ═══ -->
    <header>
        <div class="header-inner">
            <div class="header-start">
                <a href="index.html" class="icon-btn back-btn" data-tip="الرئيسية">
                    <i class="fas fa-arrow-right"></i>
                </a>
                <div class="brand-info">
                    <h1 id="roomTitle">نقاش عام</h1>
                    <div class="status-badge" id="connectionBadge">
                        <span class="status-dot"></span>
                        <span id="statusText">متصل</span>
                    </div>
                </div>
            </div>
            <div class="header-end">
                <div class="online-badge" id="onlineBadge">
                    <i class="fas fa-circle" style="font-size:.45rem;color:#10b981;"></i>
                    <span id="onlineCount">1</span>
                </div>
                <button id="searchBtn" class="icon-btn" data-tip="بحث">
                    <i class="fas fa-magnifying-glass"></i>
                </button>
                <button id="privateRoomBtn" class="icon-btn" data-tip="غرفة خاصة" aria-label="غرفة خاصة">
                    <i class="fas fa-lock"></i>
                </button>
                <button id="translateBtn" class="icon-btn" data-tip="ترجمة">
                    <i class="fas fa-language"></i>
                </button>
                <button id="langToggle" class="icon-btn" data-tip="اللغة" style="font-size:1rem;font-weight:800;">
                    <span id="langLabel">ع</span>
                </button>
                <button id="soundToggle" class="icon-btn" data-tip="الصوت">
                    <i class="fas fa-volume-high"></i>
                </button>
                <button id="themeToggle" class="icon-btn" data-tip="المظهر">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="msg-counter" id="msgCount">0</div>
            </div>
        </div>
    </header>

    <!-- Search Bar -->
    <div class="search-bar-wrap" id="searchBarWrap">
        <div class="search-inner">
            <i class="fas fa-magnifying-glass" style="color:var(--text-muted);font-size:.85rem;"></i>
            <input class="search-input" id="searchInput" placeholder="ابحث في الرسائل..." autocomplete="off">
            <span class="search-count" id="searchCount"></span>
            <button class="icon-btn" style="width:32px;height:32px;font-size:.8rem;" onclick="closeSearch()">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <!-- Pinned Message Banner -->
    <div class="pinned-banner" id="pinnedBanner">
        <div class="pinned-inner" id="pinnedInner">
            <i class="fas fa-thumbtack"></i>
            <span class="pinned-text" id="pinnedText"></span>
        </div>
    </div>

    <!-- ═══ MESSAGES ═══ -->
    <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
        <div class="main-wrap">
            <div id="messagesArea">
                <!-- skeleton shown while Firebase loads -->
                <div class="skeleton-wrap" id="skeletonLoader">

                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-bubble" style="width:55%"></div>
                    </div>
                    <div class="skeleton-row right">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-bubble" style="width:42%"></div>
                    </div>
                    <div class="skeleton-row">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-bubble" style="width:68%"></div>
                    </div>
                    <div class="skeleton-row right">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-bubble" style="width:35%"></div>
                    </div>
                    <div class="skeleton-row">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-bubble" style="width:50%"></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Typing -->
        <div class="typing-wrap">
            <div class="typing-indicator" id="typingIndicator" style="display:none;">
                <div class="typing-dots"><span></span><span></span><span></span></div>
                <span id="typingText">شخص ما يكتب...</span>
            </div>
        </div>
    </div>

    <!-- ═══ COMPOSER ═══ -->
    <div class="composer-wrap">
        <div class="composer-inner">

            <!-- Reply preview -->
            <div class="reply-preview-bar" id="replyPreview">
                <i class="fas fa-reply" style="color:var(--accent-primary);font-size:.85rem;flex-shrink:0;"></i>
                <div class="reply-preview-info">
                    <strong id="replyToName">—</strong>
                    <span id="replyTextPreview"
                        style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem;"></span>
                </div>
                <button class="reply-cancel" onclick="cancelReply()"><i class="fas fa-times"></i></button>
            </div>

            <!-- Image preview -->
            <div class="img-preview-bar" id="imgPreviewBar">
                <img class="img-thumb" id="imgThumb" src="" alt="">
                <span class="img-preview-name" id="imgPreviewName">—</span>
                <button class="img-remove" onclick="removeImage()"><i class="fas fa-times"></i></button>
            </div>

            <!-- Input bar -->
            <form id="chatForm" onsubmit="return false;">
                <div class="input-bar">
                    <input type="text" id="userName" placeholder="اسمك" maxlength="15" autocomplete="off">
                    <button type="button" class="emoji-trigger" id="emojiTrigger" title="إيموجي">😊</button>
                    <input type="file" id="imageInput" accept="image/*" style="display:none;">
                    <button type="button" class="attach-btn" id="triggerFileBtn">
                        <i class="fas fa-image"></i>
                    </button>
                    <textarea id="messageInput" placeholder="اكتب رسالتك..." rows="1" maxlength="1000"></textarea>
                    <span class="char-count" id="charCount">1000</span>
                    <button type="submit" id="sendBtn" class="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="composer-hints" aria-label="اختصارات الدردشة">
                    <span><kbd>Enter</kbd> <span>للإرسال</span></span>
                    <span><kbd>Shift</kbd> + <kbd>Enter</kbd> <span>لسطر جديد</span></span>
                    <span class="composer-private"><i class="fas fa-lock" aria-hidden="true"></i> <span>لا تشارك معلوماتك الخاصة</span></span>
                </div>
            </form>
        </div>
    </div>

    <!-- Scroll to bottom FAB -->
    <button id="scrollToBottom" class="fab-scroll" aria-label="للأسفل">
        <i class="fas fa-arrow-down"></i>
        <span class="fab-new-badge" id="newMsgBadge" style="display:none;">0</span>
    </button>

    <!-- ═══ EMOJI PICKER ═══ -->
    <div class="emoji-picker-popup" id="emojiPicker">
        <input class="emoji-search" id="emojiSearch" placeholder="🔍 ابحث عن إيموجي..." autocomplete="off">
        <div class="emoji-tabs" id="emojiTabs"></div>
        <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <!-- ═══ ACTION MODAL ═══ -->
    <div id="roomModal" class="modal-overlay room-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="roomModalTitle">
        <div class="room-modal-card">
            <h2 id="roomModalTitle">غرفة خاصة برمز</h2>
            <p id="roomModalHelp">أنشئ غرفة وشارك رمزها مع من تريد. كل من يملك الرمز يستطيع الدخول.</p>

    <!-- ═════════════════════════════════════════════════════
     JAVASCRIPT
════════════════════════════════════════════════════════ -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
        import {
            getFirestore, collection, addDoc, setDoc, serverTimestamp, query,
            orderBy, onSnapshot, limit, doc, updateDoc, deleteDoc, getDoc
        }
            from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';
        import { getAuth, signInAnonymously, onAuthStateChanged }
            from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';

        /* ──────────────────────────────
           FIREBASE CONFIG
        ────────────────────────────── */
        const firebaseConfig = {
            apiKey: "AIzaSyBgATDvc0MRJ-uknqIVUUi1gq6pS1v7coQ",
            authDomain: "my-public-chat-8cc7f.firebaseapp.com",
            projectId: "my-public-chat-8cc7f",
            storageBucket: "my-public-chat-8cc7f.firebasestorage.app",
            messagingSenderId: "707480574674",
            appId: "1:707480574674:web:4b30cb5a691a0a92516b0b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const PUBLIC_MESSAGES = collection(db, 'public_messages');
        let activeRoomCode = localStorage.getItem('chat_private_room') || null;
        let msgsCol = activeRoomCode
            ? collection(db, 'private_rooms', activeRoomCode, 'messages')
            : PUBLIC_MESSAGES;

        // Public endpoint for the Cloudflare Worker proxy (never put the ImgBB API key here).
        const IMAGE_UPLOAD_ENDPOINT = 'https://shy-wind-4be6.line97717.workers.dev/upload';
        const MAX_IMAGE_SIZE = 5 * 1024 * 1024;

        /* ──────────────────────────────
           STATE
        ────────────────────────────── */
        let currentUser = null;
        let selectedMsg = null;
        let replyTarget = null;
        let isScrolledUp = false;
        let translationMode = localStorage.getItem('translation_mode') === 'true';
        let newMsgCount = 0;
        let pinnedMsgId = localStorage.getItem('chat_pinned') || null;
        let searchActive = false;
        let searchResults = [];
        let searchIdx = 0;
        let allMessages = [];
        let typingTimer = null;
        let lastTypingTime = 0;

        const LOCAL_ID = (() => {
            let id = localStorage.getItem('chat_client_id');
            if (!id) { id = 'c_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('chat_client_id', id); }

        /* ──────────────────────────────

            ['#ec4899', '#db2777'], ['#14b8a6', '#0d9488']
        ];
        function getAvatarColor(name) {
            let h = 0; for (let c of name) h = (h * 31 + c.charCodeAt(0)) % AVATAR_COLORS.length;
            return AVATAR_COLORS[h];
        }

        /* ──────────────────────────────
           DOM REFS
        ────────────────────────────── */
        const messagesEl = document.getElementById('messagesArea');
        const chatForm = document.getElementById('chatForm');
        const sendBtn = document.getElementById('sendBtn');
        const userNameInput = document.getElementById('userName');
        const messageInput = document.getElementById('messageInput');
        const msgCountEl = document.getElementById('msgCount');
        const scrollFab = document.getElementById('scrollToBottom');
        const newMsgBadge = document.getElementById('newMsgBadge');

        const imgThumb = document.getElementById('imgThumb');

        const actionModal = document.getElementById('actionModal');

        const roomCodeResult = document.getElementById('roomCodeResult');
